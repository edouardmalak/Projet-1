<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Direct — Ce que vous devez savoir</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D2B24">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#FAFBF9;--panneau:#FFFFFF;--panneau2:#F1F6F2;--ligne:#D5E3DB;--vert:#0B6E4F;--vert-vif:#0E8A62;--texte:#1B2622;--sourd:#5A6B63;--jaune:#C97B12;--rouge:#C0392B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
.topbar{border-bottom:1px solid var(--ligne);background:var(--panneau);position:sticky;top:0;z-index:20}
.topbar .in{max-width:1400px;margin:0 auto;padding:14px 22px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.12em}
.croix{width:26px;height:26px;border-radius:6px;background:var(--vert);display:grid;place-items:center}
.droite{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:nowrap;min-width:0}
.nav{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sourd);text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
.nav:hover{color:var(--vert)}
.wrap{max-width:900px;margin:0 auto;padding:26px 22px 60px}
h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:21px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.sous{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:20px}
.carte{background:var(--panneau);border:1px solid var(--ligne);border-radius:14px;padding:20px 22px;margin-bottom:16px}
.sec{font-family:'IBM Plex Mono',monospace;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sourd);margin-bottom:12px;padding-bottom:8px;border-bottom:1px solid var(--ligne)}
.ligne{display:flex;gap:14px;padding:9px 0;border-bottom:1px solid #EDF3EF;flex-wrap:wrap}
.ligne:last-child{border-bottom:none}
.et{flex:0 0 190px;color:var(--sourd);font-size:13.5px}
.va{flex:1 1 240px;font-weight:500;white-space:pre-wrap}
.pastille{display:inline-block;width:15px;height:15px;border-radius:4px;vertical-align:-2px;margin-right:9px;border:1px solid rgba(0,0,0,.18)}
.vide{color:var(--sourd);font-style:italic;font-weight:400}
.btn{background:var(--vert);color:#fff;border:none;border-radius:10px;padding:11px 18px;font:600 14px 'Instrument Sans',sans-serif;cursor:pointer}
.btn:hover{background:var(--vert-vif)}
.btn.vide2{background:transparent;color:var(--vert);border:1px solid var(--ligne)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}
.avis{background:#FFF8EC;border:1px solid #F0DFC0;border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:18px}
.err{background:#FDECEA;border:1px solid #F5C6C2;color:#8E2C22;border-radius:10px;padding:14px;font-size:14px}
@media print{
  @page{margin:14mm}
  .topbar,.actions,.noprint{display:none!important}
  body{background:#fff;font-size:12pt}
  .wrap{max-width:none;padding:0}
  .carte{border:1px solid #CCC;border-radius:0;box-shadow:none;padding:12px 14px;margin-bottom:10px;break-inside:avoid}
  h1{font-size:17pt}
}
</style>
</head>
<body>

<div class="topbar">
  <div class="in">
    <a class="brand" href="/index.html">
      <span class="mot-marque" style="white-space:nowrap">C<svg class="cro-tiret" viewBox="0 0 66.58 57.08" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" style="width:.48em;height:.41em;vertical-align:.145em;margin:0 .07em;flex:none"><path d="M0 33.70 L24.85 57.08 L66.58 8.84 L56.37 0 L23.85 37.60 L9.26 23.86 Z" fill="#C98A2B"/></svg>DIRECT</span>
    </a>
    <div class="droite" id="nav"></div>
  </div>
</div>

<div class="wrap">
  <h1 id="titre" data-fr="Ce que vous devez savoir" data-en="What you need to know">Ce que vous devez savoir</h1>
  <div class="sous" id="sous" data-fr="Chargement…" data-en="Loading…">Chargement…</div>

  <div class="actions noprint">
    <button class="btn" id="btn-pdf" data-fr="Enregistrer en PDF" data-en="Save as PDF">Enregistrer en PDF</button>
    <a class="btn vide2" id="lien-retour" href="/mes-mandats.html" style="text-decoration:none;display:inline-block" data-fr="← Mes mandats" data-en="← My mandates">← Mes mandats</a>
  </div>

  <div id="contenu"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js?v=20260723b"></script>
<script src="/auth.js?v=20260809e"></script>
<script src="/outils.js"></script>
<script>
const $ = id => document.getElementById(id);
const sb = window.sbClient;
const esc = s => String(s==null?'':s).replace(/[<>&]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));

function ligne(etiquette, valeur, brut){
  const vide = !valeur || !String(valeur).trim();
  return '<div class="ligne"><div class="et">'+esc(etiquette)+'</div>'
    + '<div class="va'+(vide?' vide':'')+'">'
    + (vide ? cdT('Non précisé','Not specified') : (brut ? valeur : esc(valeur)))
    + '</div></div>';
}

(async function(){
  const profil = await cdExigerConnexion(['pharmacien','pharmacie','admin']);
  if(typeof cdEnteteConnecte === 'function') cdEnteteConnecte();
  if(profil.role === 'pharmacie') $('lien-retour').href = '/espace-pharmacie.html';

  const p = new URLSearchParams(location.search);
  const ref = (p.get('ref')||'').trim().toUpperCase();
  const cid = (p.get('id')||'').trim();

  let contratId = cid;
  if(!contratId && ref){
    const { data } = await sb.from('contrats').select('id').eq('numero_reference', ref).maybeSingle();
    contratId = data && data.id;
  }
  if(!contratId){
    $('sous').textContent = '';
    $('contenu').innerHTML = '<div class="err">'+cdT('Référence de contrat manquante. Ouvrez cette fiche depuis « Mes mandats ».','Missing contract reference. Open this sheet from “My mandates”.')+'</div>';
    return;
  }

  const { data, error } = await sb.rpc('get_fiche_accueil', { p_contrat: contratId });
  if(error){
    $('sous').textContent = '';
    const nonActive = /function .*get_fiche_accueil.* does not exist|schema cache/i.test(error.message||'');
    $('contenu').innerHTML = '<div class="err">'
      + (nonActive
          ? cdT('Fonction non activée — exécuter <b>sql/23</b> dans Supabase.','Function not enabled — run <b>sql/23</b> in Supabase.')
          : esc(error.message))
      + '</div>';
    return;
  }
  const f = Array.isArray(data) ? data[0] : data;
  if(!f){
    $('sous').textContent = '';
    $('contenu').innerHTML = '<div class="err">'+cdT('Fiche indisponible : ce contrat ne vous est pas attribué.','Sheet unavailable: this contract is not assigned to you.')+'</div>';
    return;
  }

  const dateTxt = (typeof cdDate === 'function') ? cdDate(f.date_contrat) : f.date_contrat;
  const h = t => String(t||'').slice(0,5);
  $('titre').textContent = cdT('Ce que vous devez savoir','What you need to know');
  $('sous').textContent  = (f.nom_pharmacie || cdT('Pharmacie','Pharmacy')) + ' · ' + f.numero_reference
                         + ' · ' + dateTxt + ' · ' + h(f.heure_debut) + '–' + h(f.heure_fin);

  let html = '';

  html += '<div class="carte"><div class="sec">'+cdT('Où et quand','Where and when')+'</div>'
       + ligne(cdT('Pharmacie','Pharmacy'), f.nom_pharmacie)
       + ligne(cdT('Adresse','Address'), [f.adresse, f.ville, f.code_postal].filter(Boolean).join(', '))
       + ligne('Date', dateTxt + ' · ' + h(f.heure_debut) + cdT(' à ',' to ') + h(f.heure_fin))
       + ligne(cdT('Logiciel de laboratoire','Lab software'), f.logiciel)
       + ligne(cdT('Volume Rx / jour','Rx volume / day'), [
           f.rx_jour_semaine ? f.rx_jour_semaine + cdT(' (semaine)',' (weekday)') : null,
           f.rx_jour_weekend ? f.rx_jour_weekend + cdT(' (weekend)',' (weekend)') : null
         ].filter(Boolean).join(' · '))
       + '</div>';

  const tel = t => t ? '<a href="tel:'+esc(t)+'" style="color:var(--vert);text-decoration:none">'
                     + esc(typeof cdTelAffiche==='function' ? cdTelAffiche(t) : t) + '</a>' : '';
  html += '<div class="carte"><div class="sec">'+cdT('Qui contacter','Who to contact')+'</div>'
       + ligne(cdT('Personne-ressource','Contact person'), f.info_contact_nom)
       + ligne(cdT('Son numéro','Their number'), tel(f.info_contact_tel), true)
       + ligne(cdT('Téléphone de la pharmacie','Pharmacy phone'), tel(f.telephone), true)
       + '</div>';

  html += '<div class="carte"><div class="sec">'+cdT('Arrivée et stationnement','Arrival and parking')+'</div>'
       + ligne(cdT('À l’arrivée','On arrival'), f.info_arrivee)
       + ligne(cdT('Stationnement','Parking'), f.info_stationnement)
       + ligne(cdT('Notes d’accès','Access notes'), f.notes_acces)
       + '</div>';

  const pl = Array.isArray(f.info_plateaux) ? f.info_plateaux
           : (typeof f.info_plateaux === 'string' ? JSON.parse(f.info_plateaux || '[]') : []);
  html += '<div class="carte"><div class="sec">'+cdT('Code de couleurs — plateaux / paniers','Colour code — trays / baskets')+'</div>';
  if(!pl.length){
    html += '<div class="ligne"><div class="va vide">'+cdT('Cette pharmacie n’a pas précisé de code de couleurs.','This pharmacy has not specified a colour code.')+'</div></div>';
  } else {
    pl.forEach(c => {
      html += '<div class="ligne"><div class="et">'
           + '<span class="pastille" style="background:'+esc(c.hex||'#CCC')+'"></span>'
           + esc(c.couleur || '—') + '</div>'
           + '<div class="va'+((c.sens||'').trim()?'':' vide')+'">'
           + esc((c.sens||'').trim() || cdT('Non précisé','Not specified')) + '</div></div>';
    });
  }
  html += '</div>';

  html += '<div class="carte"><div class="sec">'+cdT('Autres consignes','Other instructions')+'</div>'
       + ligne(cdT('Consignes de la pharmacie','Pharmacy instructions'), f.info_instructions)
       + '</div>';

  html += '<div class="avis noprint">'+cdT('Ces informations vous sont transmises parce que ce quart vous a été attribué. Elles restent confidentielles.','This information is shared with you because this shift was assigned to you. It remains confidential.')+'</div>';

  $('contenu').innerHTML = html;

  $('btn-pdf').addEventListener('click', ()=> window.print());
  if(location.hash === '#pdf') setTimeout(()=> window.print(), 600);
})();
</script>
</body>
</html>
