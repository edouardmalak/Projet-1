<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Direct — Évaluations</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D2B24">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#FAFBF9;--panneau:#FFFFFF;--panneau2:#F1F6F2;--ligne:#D5E3DB;--ligne2:#C3D6CB;--vert:#0B6E4F;--vert-vif:#0E8A62;--texte:#1B2622;--sourd:#5A6B63;--jaune:#C97B12;--rouge:#C0392B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
.topbar{border-bottom:1px solid var(--ligne);background:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
.topbar .in{max-width:1400px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.12em}
.croix{width:28px;height:28px;display:grid;place-items:center;background:var(--vert);border-radius:5px;flex:none}
.topbar .droite{display:flex;align-items:center;gap:10px;min-width:0}
.topbar a.nav{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sourd);text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
.topbar a.nav:hover{color:var(--vert-vif)}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 50px}
h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.sous{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:22px}
h2{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--sourd);margin:26px 0 12px}
.carte{background:var(--panneau);border:1px solid var(--ligne);border-radius:8px;padding:18px;margin-bottom:12px}
.ligne-item{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.r{font-family:'IBM Plex Mono',monospace;color:var(--vert-vif);font-weight:700;letter-spacing:.05em}
.m{color:var(--sourd);font-size:13px;font-family:'IBM Plex Mono',monospace;margin-top:3px}
.btn{background:var(--vert);color:#FFFFFF;border:none;border-radius:7px;padding:9px 18px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{background:var(--vert-vif)}
.btn.ligne{background:transparent;border:1px solid var(--ligne2);color:var(--texte)}
.btn.ligne:hover{border-color:var(--vert)}
.vide{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;text-align:center;padding:26px 0}
.retour{display:inline-block;color:var(--vert-vif);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:14px}
/* résumé note */
.resume{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.big{font-family:'IBM Plex Mono',monospace;font-size:34px;font-weight:700;line-height:1}
.big small{font-size:15px;color:var(--sourd)}
.resume .st{font-size:20px;color:var(--jaune);letter-spacing:2px}
.resume .kpi{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sourd)}
.resume .kpi b{color:var(--texte);font-size:15px;display:block}
/* avis reçu */
.avis{border:1px solid var(--ligne);border-radius:8px;padding:14px 16px;margin-bottom:10px;background:var(--panneau)}
.avis .tete{display:flex;justify-content:space-between;align-items:center;gap:10px}
.avis .st{color:var(--jaune);letter-spacing:2px;font-size:16px}
.avis .cite{margin-top:8px;color:var(--texte);font-size:14px;line-height:1.5}
.avis .meta{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sourd);margin-top:8px}
.tag{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.05em;padding:2px 8px;border-radius:99px;border:1px solid}
.tag.oui{color:var(--vert-vif);border-color:rgba(23,201,128,.45);background:rgba(18,169,110,.1)}
.tag.non{color:var(--sourd);border-color:var(--ligne2)}
/* formulaire */
.forme .avis-note{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.05em;color:var(--sourd);line-height:1.7;background:var(--panneau2);border:1px solid var(--ligne);border-radius:7px;padding:12px 14px;margin:4px 0 20px}
.champ{margin-bottom:20px}
.champ .lbl{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--sourd);margin-bottom:8px}
.champ .lbl b{color:var(--rouge)}
.etoiles{display:flex;gap:6px}
.etoiles span{font-size:34px;color:var(--ligne2);cursor:pointer;line-height:1;transition:color .08s,transform .08s}
.etoiles span:hover{transform:scale(1.1)}
.etoiles span.on{color:var(--jaune)}
.ouinon{display:flex;gap:10px}
.ouinon button{flex:0 0 auto;background:transparent;border:1px solid var(--ligne2);color:var(--texte);border-radius:8px;padding:9px 22px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em;cursor:pointer}
.ouinon button.on{background:rgba(18,169,110,.16);border-color:var(--vert);color:var(--vert-vif)}
textarea{width:100%;background:#F4F8F5;border:1px solid var(--ligne2);border-radius:8px;padding:11px 13px;color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:14px;resize:vertical;min-height:80px}
textarea:focus{outline:none;border-color:var(--vert)}
.forme-actions{display:flex;gap:12px;align-items:center;margin-top:8px}
.msg{font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:10px}
.msg.ok{color:var(--vert-vif)} .msg.err{color:var(--rouge)}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
</head>
<body>
<div class="topbar">
  <div class="in">
    <a class="brand" href="/index.html"><span class="mot-marque" style="white-space:nowrap">C<svg class="cro-tiret" viewBox="0 0 66.58 57.08" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" style="width:.48em;height:.41em;vertical-align:.145em;margin:0 .07em;flex:none"><path d="M0 33.70 L24.85 57.08 L66.58 8.84 L56.37 0 L23.85 37.60 L9.26 23.86 Z" fill="#C98A2B"/></svg>DIRECT</span></a>
    <div class="droite" id="nav"></div>
  </div>
</div>
<div class="wrap" id="wrap"><div class="vide" data-fr="Chargement…" data-en="Loading…">Chargement…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js?v=20260723b"></script>
<script src="/auth.js?v=20260809e"></script>
<script>
const sb = window.sbClient;
const $ = id => document.getElementById(id);
let profil = null;
function etoilesTxt(n){ return '★★★★★'.slice(0,n) + '☆☆☆☆☆'.slice(0,5-n); }
function esc(s){ return String(s||'').replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c])); }
function refDepuisUrl(){ const q = new URLSearchParams(location.search).get('ref'); return q ? q.toUpperCase() : null; }
function refFiabiliteDepuisUrl(){ const q = new URLSearchParams(location.search).get('fiabilite'); return q ? q.toUpperCase() : null; }

(async function(){
  profil = await cdExigerConnexion(['pharmacien','pharmacie']);
  cdEnteteConnecte();
  $('nav').innerHTML = (profil.role==='pharmacie'
    ? '<a class="nav" href="/espace-pharmacie.html">'+cdT('Espace','Space')+'</a>'
    : '<a class="nav" href="/contrats.html">'+cdT('Contrats','Contracts')+'</a>');
  const ref = refDepuisUrl();
  const refFiab = refFiabiliteDepuisUrl();
  if(refFiab){ ouvrirFormulaireFiabilite(refFiab); }
  else if(ref){ ouvrirFormulaire(ref); }
  else { tableauBord(); }
})();

/* ---------------- TABLEAU DE BORD ÉVALUATIONS ---------------- */
async function tableauBord(){
  const wrap = $('wrap');
  wrap.innerHTML = '<h1>'+cdT('Évaluations','Reviews')+'</h1><p class="sous">'+cdT('Vos avis améliorent les jumelages. Confidentiels jusqu\'à l\'envoi des deux côtés.','Your reviews improve matching. Confidential until both sides submit.')+'</p>'+
    '<div id="resume"></div>'+
    '<h2>'+cdT('À évaluer','To review')+'</h2><div id="afaire"><div class="vide">'+cdT('Chargement…','Loading…')+'</div></div>'+
    '<h2>'+cdT('Notes reçues','Reviews received')+'</h2><div id="recues"><div class="vide">'+cdT('Chargement…','Loading…')+'</div></div>'+
    (profil.role==='pharmacien'
      ? '<h2>'+cdT('Fiabilité des annonces — à noter','Listing accuracy — to rate')+'</h2><p class="sous" style="margin:-8px 0 12px">'+cdT('La réalité a-t-elle correspondu à ce qui était annoncé ? Distinct de votre évaluation générale ci-dessus.','Did reality match what was advertised? Separate from your general review above.')+'</p><div id="fiab-afaire"><div class="vide">'+cdT('Chargement…','Loading…')+'</div></div>'
      : '<h2>'+cdT('Fiabilité de vos annonces','Accuracy of your listings')+'</h2><p class="sous" style="margin:-8px 0 12px">'+cdT('Ce que les pharmaciens rapportent sur l\'exactitude de vos annonces (volume, personnel) — visible dès 3 avis.','What pharmacists report about the accuracy of your listings (volume, staffing) — visible from 3 reviews.')+'</p><div id="fiab-resume"><div class="vide">'+cdT('Chargement…','Loading…')+'</div></div>');

  // Résumé de ma note
  try{
    const { data } = await sb.rpc('get_note_profil', { p_profil: profil.id });
    const n = (data && data[0]) || {moyenne:null, nombre:0, taux_reviendrait:0};
    const el = $('resume');
    if(n.nombre > 0){
      el.innerHTML = '<div class="carte"><div class="resume">'+
        '<div><div class="big">'+Number(n.moyenne).toFixed(2)+' <small>/5</small></div>'+
        '<div class="st">'+etoilesTxt(Math.round(n.moyenne))+'</div></div>'+
        '<div class="kpi">'+cdT('Évaluations','Reviews')+'<b>'+n.nombre+'</b></div>'+
        '<div class="kpi">'+cdT('Retravailleraient','Would work again')+'<b>'+n.taux_reviendrait+' %</b></div>'+
        '</div></div>';
    } else {
      el.innerHTML = '<div class="carte"><div class="vide">'+cdT('Aucune note reçue pour l\'instant — elle apparaîtra une fois vos contrats évalués des deux côtés.','No rating received yet — it appears once your contracts are reviewed on both sides.')+'</div></div>';
    }
  }catch(e){ $('resume').innerHTML=''; }

  // À faire
  try{
    const { data } = await sb.rpc('get_evaluations_a_faire');
    const l = $('afaire');
    if(!data || !data.length){ l.innerHTML = '<div class="vide">'+cdT('Rien à évaluer — bravo, vous êtes à jour.','Nothing to review — you\'re all caught up.')+'</div>'; }
    else l.innerHTML = data.map(c =>
      '<div class="carte"><div class="ligne-item"><div>'+
      '<span class="r">'+esc(c.numero_reference)+'</span>'+
      '<div class="m">'+cdDate(c.date_contrat)+' · '+esc(c.autre_nom)+'</div></div>'+
      '<a class="btn" href="/evaluations.html?ref='+encodeURIComponent(c.numero_reference)+'">★ '+cdT('Évaluer','Review')+'</a>'+
      '</div></div>').join('');
  }catch(e){ $('afaire').innerHTML = '<div class="vide">—</div>'; }

  // Reçues
  try{
    const { data } = await sb.rpc('get_evaluations_recues');
    const l = $('recues');
    if(!data || !data.length){ l.innerHTML = '<div class="vide">'+cdT('Aucun avis reçu pour l\'instant.','No review received yet.')+'</div>'; }
    else l.innerHTML = data.map(a =>
      '<div class="avis"><div class="tete"><span class="st">'+etoilesTxt(a.note)+'</span>'+
      (a.reviendrait===true?'<span class="tag oui">'+cdT('Retravaillerait ✓','Would work again ✓')+'</span>':
       a.reviendrait===false?'<span class="tag non">'+cdT('Ne reviendrait pas','Would not return')+'</span>':'')+'</div>'+
      (a.commentaire?'<div class="cite">« '+esc(a.commentaire)+' »</div>':'')+
      '<div class="meta">'+esc(a.numero_reference)+' · '+cdDate(a.date_contrat)+'</div></div>').join('');
  }catch(e){ $('recues').innerHTML = '<div class="vide">—</div>'; }

  // Fiabilité de l'annonce (pharmacien : à faire / pharmacie : résumé reçu)
  if(profil.role==='pharmacien'){
    try{
      const { data } = await sb.rpc('get_fiabilite_a_faire');
      const l = $('fiab-afaire');
      if(!data || !data.length){ l.innerHTML = '<div class="vide">'+cdT('Rien à noter pour l\'instant.','Nothing to rate right now.')+'</div>'; }
      else l.innerHTML = data.map(c =>
        '<div class="carte"><div class="ligne-item"><div>'+
        '<span class="r">'+esc(c.numero_reference)+'</span>'+
        '<div class="m">'+cdDate(c.date_contrat)+' · '+esc(c.pharmacie_nom)+'</div></div>'+
        '<a class="btn" href="/evaluations.html?fiabilite='+encodeURIComponent(c.numero_reference)+'">📋 '+cdT('Noter la précision','Rate accuracy')+'</a>'+
        '</div></div>').join('');
    }catch(e){ $('fiab-afaire').innerHTML = '<div class="vide">—</div>'; }
  } else {
    try{
      const { data } = await sb.rpc('get_fiabilite_pharmacie', { p_pharmacie_id: profil.id });
      const n = (data && data[0]) || null;
      const el = $('fiab-resume');
      if(n && n.nb_avis){
        el.innerHTML = '<div class="carte"><div class="resume">'+
          '<div><div class="big">'+Number(n.note_moyenne).toFixed(2)+' <small>/5</small></div></div>'+
          '<div class="kpi">'+cdT('Avis','Reviews')+'<b>'+n.nb_avis+'</b></div>'+
          (n.taux_volume_conforme!=null ? '<div class="kpi">'+cdT('Volume conforme','Volume as advertised')+'<b>'+n.taux_volume_conforme+' %</b></div>' : '')+
          (n.taux_personnel_conforme!=null ? '<div class="kpi">'+cdT('Personnel conforme','Staffing as advertised')+'<b>'+n.taux_personnel_conforme+' %</b></div>' : '')+
          '</div></div>';
      } else {
        el.innerHTML = '<div class="carte"><div class="vide">'+cdT('Pas encore assez d\'avis pour afficher un score (minimum 3).','Not enough reviews yet to show a score (minimum 3).')+'</div></div>';
      }
    }catch(e){ $('fiab-resume').innerHTML=''; }
  }
}

/* ---------------- FORMULAIRE D'ÉVALUATION ---------------- */
let noteSel = 0, reviendraitSel = null, contratSel = null;
let notePrecisionSel = 0, volumeSel = null, personnelSel = null, contratFiabSel = null;
async function ouvrirFormulaire(ref){
  const wrap = $('wrap');
  wrap.innerHTML = '<div class="vide">Chargement…</div>';
  // retrouver le contrat parmi ceux « à faire »
  let cible = null;
  try{
    const { data } = await sb.rpc('get_evaluations_a_faire');
    cible = (data||[]).find(c => c.numero_reference === ref);
  }catch(e){}
  if(!cible){
    wrap.innerHTML = '<a class="retour" href="/evaluations.html">← '+cdT('Évaluations','Reviews')+'</a>'+
      '<div class="carte"><div class="vide">'+cdT('Ce contrat est introuvable, n\'est pas encore évaluable, ou vous l\'avez déjà évalué.','This contract is not found, not yet reviewable, or you have already reviewed it.')+'</div></div>';
    return;
  }
  contratSel = cible.contrat_id;
  const quoi = cible.mon_role === 'pharmacie' ? cdT('ce pharmacien remplaçant','this replacement pharmacist') : cdT('cette pharmacie','this pharmacy');
  wrap.innerHTML =
    '<a class="retour" href="/evaluations.html">← '+cdT('Toutes les évaluations','All reviews')+'</a>'+
    '<h1>'+cdT('Évaluation','Review')+'</h1>'+
    '<p class="sous">'+esc(cible.numero_reference)+' · '+cdDate(cible.date_contrat)+' · '+esc(cible.autre_nom)+'</p>'+
    '<div class="carte forme">'+
      '<div class="avis-note">'+cdT('Comment avez-vous trouvé ','How did you find ')+quoi+cdT(' ? (≈ 20 secondes)','? (≈ 20 seconds)')+'<br>'+
      cdT('Vos commentaires améliorent les jumelages. Confidentiels jusqu\'à l\'envoi des deux côtés (max. 72 h).','Your comments improve matching. Confidential until both sides submit (max. 72 h).')+'<br>'+
      cdT('Restez respectueux — aucune information sur un patient.','Stay respectful — no patient information.')+'</div>'+
      '<div class="champ"><div class="lbl">'+cdT('Note globale','Overall rating')+' <b>*</b></div>'+
        '<div class="etoiles" id="etoiles">'+[1,2,3,4,5].map(i=>'<span data-n="'+i+'">★</span>').join('')+'</div></div>'+
      '<div class="champ"><div class="lbl">'+(cible.mon_role==='pharmacie'?cdT('Réembaucheriez-vous cette personne ?','Would you rehire this person?'):cdT('Retravailleriez-vous à cet endroit ?','Would you work here again?'))+' <b>*</b></div>'+
        '<div class="ouinon" id="ouinon"><button data-v="oui">'+cdT('Oui','Yes')+'</button><button data-v="non">'+cdT('Non','No')+'</button></div></div>'+
      '<div class="champ"><div class="lbl">'+cdT('Commentaire (optionnel)','Comment (optional)')+'</div>'+
        '<textarea id="comm" maxlength="1000" placeholder="'+cdT('Ce qui s\'est bien passé, ce qui pourrait être amélioré…','What went well, what could be improved…')+'"></textarea></div>'+
      '<div class="forme-actions"><button class="btn" id="envoyer">'+cdT('Soumettre','Submit')+'</button>'+
        '<a class="btn ligne" href="/evaluations.html">'+cdT('Passer pour l\'instant','Skip for now')+'</a></div>'+
      '<div class="msg" id="msg"></div>'+
    '</div>';

  document.querySelectorAll('#etoiles span').forEach(s=>{
    s.onclick = ()=>{ noteSel = +s.dataset.n; peindreEtoiles(); };
    s.onmouseenter = ()=>peindreEtoiles(+s.dataset.n);
  });
  $('etoiles').onmouseleave = ()=>peindreEtoiles();
  document.querySelectorAll('#ouinon button').forEach(b=>{
    b.onclick = ()=>{ reviendraitSel = b.dataset.v==='oui'; document.querySelectorAll('#ouinon button').forEach(x=>x.classList.toggle('on', x===b)); };
  });
  $('envoyer').onclick = soumettre;
}
function peindreEtoiles(survol){
  const n = survol || noteSel;
  document.querySelectorAll('#etoiles span').forEach(s=> s.classList.toggle('on', +s.dataset.n <= n));
}
async function soumettre(){
  const msg = $('msg');
  if(!noteSel){ msg.className='msg err'; msg.textContent=cdT('Choisissez une note (1 à 5 étoiles).','Choose a rating (1 to 5 stars).'); return; }
  if(reviendraitSel===null){ msg.className='msg err'; msg.textContent=cdT('Indiquez si vous reviendriez.','Indicate whether you would return.'); return; }
  $('envoyer').disabled = true; msg.className='msg'; msg.textContent=cdT('Envoi…','Sending…');
  const { error } = await sb.rpc('soumettre_evaluation', {
    p_contrat: contratSel, p_note: noteSel, p_reviendrait: reviendraitSel,
    p_commentaire: ($('comm').value || '').trim()
  });
  if(error){ $('envoyer').disabled=false; msg.className='msg err'; msg.textContent=cdT('Erreur : ','Error: ')+error.message; return; }
  msg.className='msg ok'; msg.textContent=cdT('Merci ! Votre évaluation a été enregistrée.','Thank you! Your review has been saved.');
  setTimeout(()=>location.href='/evaluations.html', 1100);
}

/* ---------------- FORMULAIRE FIABILITÉ DE L'ANNONCE (pharmacien seul) ---------------- */
async function ouvrirFormulaireFiabilite(ref){
  const wrap = $('wrap');
  wrap.innerHTML = '<div class="vide">Chargement…</div>';
  if(profil.role !== 'pharmacien'){
    wrap.innerHTML = '<a class="retour" href="/evaluations.html">← '+cdT('Évaluations','Reviews')+'</a>'+
      '<div class="carte"><div class="vide">'+cdT('Seuls les pharmaciens remplaçants notent la précision d\'une annonce.','Only replacement pharmacists rate a listing\'s accuracy.')+'</div></div>';
    return;
  }
  let cible = null;
  try{
    const { data } = await sb.rpc('get_fiabilite_a_faire');
    cible = (data||[]).find(c => c.numero_reference === ref);
  }catch(e){}
  if(!cible){
    wrap.innerHTML = '<a class="retour" href="/evaluations.html">← '+cdT('Évaluations','Reviews')+'</a>'+
      '<div class="carte"><div class="vide">'+cdT('Ce contrat est introuvable, pas encore complété, ou vous l\'avez déjà noté.','This contract is not found, not yet completed, or you have already rated it.')+'</div></div>';
    return;
  }
  contratFiabSel = cible.contrat_id;
  wrap.innerHTML =
    '<a class="retour" href="/evaluations.html">← '+cdT('Toutes les évaluations','All reviews')+'</a>'+
    '<h1>'+cdT('Précision de l\'annonce','Listing accuracy')+'</h1>'+
    '<p class="sous">'+esc(cible.numero_reference)+' · '+cdDate(cible.date_contrat)+' · '+esc(cible.pharmacie_nom)+'</p>'+
    '<div class="carte forme">'+
      '<div class="avis-note">'+cdT('La réalité correspondait-elle à ce qui était annoncé ? (≈ 20 secondes)','Did reality match what was advertised? (≈ 20 seconds)')+'<br>'+
      cdT('Distinct de votre évaluation générale — ceci porte uniquement sur l\'exactitude de l\'annonce (volume, personnel).','Separate from your general review — this is only about the listing\'s accuracy (volume, staffing).')+'</div>'+
      '<div class="champ"><div class="lbl">'+cdT('Précision globale de l\'annonce','Overall listing accuracy')+' <b>*</b></div>'+
        '<div class="etoiles" id="etoiles-fiab">'+[1,2,3,4,5].map(i=>'<span data-n="'+i+'">★</span>').join('')+'</div></div>'+
      '<div class="champ"><div class="lbl">'+cdT('Volume de Rx conforme à l\'annonce ?','Rx volume as advertised?')+'</div>'+
        '<div class="ouinon" id="ouinon-volume"><button data-v="oui">'+cdT('Oui','Yes')+'</button><button data-v="non">'+cdT('Non','No')+'</button></div></div>'+
      '<div class="champ"><div class="lbl">'+cdT('Personnel (ATP / seul(e)) conforme à l\'annonce ?','Staffing (technician / solo) as advertised?')+'</div>'+
        '<div class="ouinon" id="ouinon-personnel"><button data-v="oui">'+cdT('Oui','Yes')+'</button><button data-v="non">'+cdT('Non','No')+'</button></div></div>'+
      '<div class="champ"><div class="lbl">'+cdT('Commentaire (optionnel)','Comment (optional)')+'</div>'+
        '<textarea id="comm-fiab" maxlength="1000" placeholder="'+cdT('Ce qui différait de l\'annonce…','What differed from the listing…')+'"></textarea></div>'+
      '<div class="forme-actions"><button class="btn" id="envoyer-fiab">'+cdT('Soumettre','Submit')+'</button>'+
        '<a class="btn ligne" href="/evaluations.html">'+cdT('Passer pour l\'instant','Skip for now')+'</a></div>'+
      '<div class="msg" id="msg-fiab"></div>'+
    '</div>';

  document.querySelectorAll('#etoiles-fiab span').forEach(s=>{
    s.onclick = ()=>{ notePrecisionSel = +s.dataset.n; peindreEtoilesFiab(); };
    s.onmouseenter = ()=>peindreEtoilesFiab(+s.dataset.n);
  });
  $('etoiles-fiab').onmouseleave = ()=>peindreEtoilesFiab();
  document.querySelectorAll('#ouinon-volume button').forEach(b=>{
    b.onclick = ()=>{ volumeSel = b.dataset.v==='oui'; document.querySelectorAll('#ouinon-volume button').forEach(x=>x.classList.toggle('on', x===b)); };
  });
  document.querySelectorAll('#ouinon-personnel button').forEach(b=>{
    b.onclick = ()=>{ personnelSel = b.dataset.v==='oui'; document.querySelectorAll('#ouinon-personnel button').forEach(x=>x.classList.toggle('on', x===b)); };
  });
  $('envoyer-fiab').onclick = soumettreFiabilite;
}
function peindreEtoilesFiab(survol){
  const n = survol || notePrecisionSel;
  document.querySelectorAll('#etoiles-fiab span').forEach(s=> s.classList.toggle('on', +s.dataset.n <= n));
}
async function soumettreFiabilite(){
  const msg = $('msg-fiab');
  if(!notePrecisionSel){ msg.className='msg err'; msg.textContent=cdT('Choisissez une note (1 à 5 étoiles).','Choose a rating (1 to 5 stars).'); return; }
  $('envoyer-fiab').disabled = true; msg.className='msg'; msg.textContent=cdT('Envoi…','Sending…');
  const { error } = await sb.rpc('soumettre_fiabilite', {
    p_contrat: contratFiabSel, p_note_precision: notePrecisionSel,
    p_volume_conforme: volumeSel, p_personnel_conforme: personnelSel,
    p_commentaire: ($('comm-fiab').value || '').trim()
  });
  if(error){ $('envoyer-fiab').disabled=false; msg.className='msg err'; msg.textContent=cdT('Erreur : ','Error: ')+error.message; return; }
  msg.className='msg ok'; msg.textContent=cdT('Merci ! Votre avis a été enregistré.','Thank you! Your feedback has been saved.');
  setTimeout(()=>location.href='/evaluations.html', 1100);
}
</script>
</body>
</html>
