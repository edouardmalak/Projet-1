<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Direct — Vérification des comptes</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D2B24">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#FAFBF9;--panneau:#FFFFFF;--panneau2:#F1F6F2;--ligne:#D5E3DB;--ligne2:#C3D6CB;--vert:#0B6E4F;--vert-vif:#0E8A62;--texte:#1B2622;--sourd:#5A6B63;--jaune:#C97B12;--rouge:#C0392B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
background-image:linear-gradient(rgba(232,184,73,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,184,73,.03) 1px,transparent 1px);background-size:44px 44px}
.mono{font-family:'IBM Plex Mono',monospace}
.topbar{border-bottom:1px solid var(--ligne);background:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
.topbar .in{max-width:1400px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.12em}
.croix{width:28px;height:28px;display:grid;place-items:center;background:var(--jaune);border-radius:5px;flex:none}
.topbar .droite{display:flex;align-items:center;gap:10px;color:var(--sourd);min-width:0;flex-wrap:nowrap}
.wrap{max-width:1100px;margin:0 auto;padding:36px 18px 70px}
h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
h1 b{color:var(--jaune)}
.sous{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:22px}
.carte{background:var(--panneau);border:1px solid var(--ligne);border-radius:8px;padding:24px;position:relative;margin-bottom:20px}
.carte::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--jaune),transparent)}
.sec{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--jaune);margin-bottom:14px}
.sec small{color:var(--sourd);text-transform:none;letter-spacing:.04em;margin-left:8px}
.table-scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:12.5px}
th{padding:9px 11px;text-align:left;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--sourd);border-bottom:1px solid var(--ligne);white-space:nowrap}
td{padding:10px 11px;border-bottom:1px solid var(--ligne);vertical-align:top}
tbody tr:last-child td{border-bottom:none}
.role{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid var(--ligne2);color:var(--sourd);white-space:nowrap}
.role.pharmacie{color:var(--vert-vif);border-color:rgba(23,201,128,.4)}
.role.pharmacien{color:var(--texte)}
.badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 9px;border-radius:3px;border:1px solid var(--ligne2);color:var(--sourd);white-space:nowrap}
.badge.verifie{color:var(--vert-vif);border-color:rgba(23,201,128,.4);background:rgba(18,169,110,.08)}
.badge.en_attente{color:var(--jaune);border-color:rgba(232,184,73,.4);background:rgba(232,184,73,.08)}
.badge.rejete{color:var(--rouge);border-color:rgba(229,72,77,.4);background:rgba(229,72,77,.06)}
.badge.suspendu{color:var(--sourd);border-color:var(--ligne2);background:var(--panneau2)}
.champs{font-size:11.5px;color:var(--sourd);white-space:normal;max-width:220px}
.champs b{color:var(--texte);font-weight:600}
.complet{font-size:11px;white-space:nowrap}
.complet.plein{color:var(--vert-vif)}
.complet.partiel{color:var(--jaune)}
.actions{display:flex;flex-direction:column;gap:6px;min-width:130px}
.btn-a{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:6px 10px;border-radius:3px;cursor:pointer;white-space:nowrap;border:1px solid var(--ligne2);background:transparent;color:var(--sourd)}
.btn-a:hover{filter:brightness(.96)}
.btn-a.oui{background:var(--vert-vif);color:#fff;border-color:var(--vert-vif);font-weight:700}
.btn-a.non{background:transparent;color:var(--rouge);border-color:rgba(229,72,77,.4)}
.btn-a:disabled{opacity:.5;cursor:default}
.filtres{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.filtres button{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:7px 13px;border-radius:4px;cursor:pointer;border:1px solid var(--ligne2);background:transparent;color:var(--sourd)}
.filtres button.actif{background:var(--jaune);color:#1A1405;border-color:var(--jaune);font-weight:700}
.vide{text-align:center;color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:24px 0}
.raison-txt{font-size:11px;color:var(--sourd);font-style:italic;margin-top:2px;white-space:normal;max-width:200px}
@media(max-width:600px){
  th:nth-child(4),td:nth-child(4){display:none} /* masque "Complétude" en mobile étroit */
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
</head>
<body>

<div class="topbar">
  <div class="in">
    <a class="brand" href="/index.html">
      <span class="mot-marque" style="white-space:nowrap">C<svg class="cro-tiret" viewBox="0 0 66.58 57.08" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" style="width:.48em;height:.41em;vertical-align:.145em;margin:0 .07em;flex:none"><path d="M0 33.70 L24.85 57.08 L66.58 8.84 L56.37 0 L23.85 37.60 L9.26 23.86 Z" fill="#C98A2B"/></svg>DIRECT</span>
    </a>
    <div class="droite"></div>
  </div>
</div>

<div class="wrap">
  <h1>Vérification <b>·</b> Comptes</h1>
  <p class="sous">Pharmaciens et pharmacies en attente d'approbation — raison + auditeur conservés pour chaque décision</p>

  <div class="carte">
    <div class="filtres" id="filtres"></div>
    <div class="sec" id="n-file">Chargement…</div>
    <div class="table-scroll">
      <table>
        <thead><tr>
          <th>Rôle</th><th>Nom / Établissement</th><th>Identifiants</th><th>Complétude</th>
          <th>Contact</th><th>Inscrit le</th><th>Statut</th><th>Actions</th>
        </tr></thead>
        <tbody id="t-file"><tr><td colspan="8" class="vide">Chargement…</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js?v=20260726a"></script>
<script src="/auth.js?v=20260809e"></script>
<script>
const sb = window.sbClient;
const $ = id => document.getElementById(id);
let FILE = [];
let FILTRE = 'en_attente';
const LIB_STATUT = { en_attente:'En attente', verifie:'Vérifié', rejete:'Rejeté', suspendu:'Suspendu' };

function cdToast(texte, ok){
  let t = document.getElementById('cd-toast');
  if(!t){
    t = document.createElement('div'); t.id='cd-toast';
    t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:9999;max-width:560px;padding:12px 18px;border-radius:6px;font-family:"IBM Plex Mono",monospace;font-size:12.5px;line-height:1.45;letter-spacing:.02em;box-shadow:0 8px 30px rgba(0,0,0,.35);opacity:0;transition:opacity .2s;text-align:center';
    document.body.appendChild(t);
  }
  t.textContent = texte;
  t.style.background = ok ? 'rgba(18,169,110,.15)' : 'rgba(229,72,77,.15)';
  t.style.color = ok ? '#0D8A61' : '#E5484D';
  t.style.border = '1px solid ' + (ok ? 'rgba(23,201,128,.5)' : 'rgba(229,72,77,.5)');
  t.style.opacity = '1';
  clearTimeout(t._to);
  t._to = setTimeout(()=>{ t.style.opacity='0'; }, ok ? 3500 : 9000);
}

(async function(){
  const profil = await cdExigerConnexion(['admin']);
  if(profil.role !== 'admin'){ location.replace(cdAccueilPourRole(profil.role)); return; }
  cdEnteteConnecte();
  await charger();
})();

async function charger(){
  const { data, error } = await sb.rpc('get_file_verification');
  if(error){
    $('t-file').innerHTML = '<tr><td colspan="8" class="vide">Non activé — exécutez sql/25-verification-queue.sql dans Supabase.</td></tr>';
    $('n-file').textContent = '';
    $('filtres').innerHTML = '';
    return;
  }
  FILE = data || [];
  dessinerFiltres();
  dessiner();
}

function dessinerFiltres(){
  const z = $('filtres'); z.innerHTML = '';
  const ordre = ['en_attente','verifie','rejete','suspendu','tous'];
  ordre.forEach(s=>{
    const n = s==='tous' ? FILE.length : FILE.filter(f=>f.statut_verification===s).length;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = FILTRE===s ? 'actif' : '';
    b.textContent = (s==='tous' ? 'Tous' : LIB_STATUT[s]) + ' (' + n + ')';
    b.onclick = ()=>{ FILTRE = s; dessinerFiltres(); dessiner(); };
    z.appendChild(b);
  });
}

function nomDe(r){
  return r.role==='pharmacie'
    ? (r.nom_pharmacie || ((r.prenom||'')+' '+(r.nom||'')).trim() || r.courriel || '—')
    : (((r.prenom||'')+' '+(r.nom||'')).trim() || r.courriel || '—');
}

function dessiner(){
  const tb = $('t-file');
  const liste = FILTRE==='tous' ? FILE : FILE.filter(f=>f.statut_verification===FILTRE);
  $('n-file').textContent = liste.length + ' compte' + (liste.length>1?'s':'') +
    (FILTRE!=='tous' ? ' · ' + (LIB_STATUT[FILTRE]||FILTRE) : '');
  if(!liste.length){ tb.innerHTML = '<tr><td colspan="8" class="vide">Aucun compte dans ce filtre.</td></tr>'; return; }
  tb.innerHTML = '';
  liste.forEach(r=>{
    const tr = document.createElement('tr');
    const td = (html)=>{ const c=document.createElement('td'); c.innerHTML = html; return c; };

    const role = '<span class="role ' + r.role + '">' + (r.role==='pharmacie'?'Pharmacie':'Pharmacien') + '</span>';

    const identifiants = r.role==='pharmacie'
      ? '<div class="champs">' +
          (r.neq ? '<b>NEQ</b> ' + r.neq + '<br>' : '<span style="color:var(--rouge)">NEQ manquant</span><br>') +
          (r.banniere ? r.banniere + '<br>' : '') +
          ([r.adresse, r.ville, r.code_postal].filter(Boolean).join(', ') || '<span style="color:var(--rouge)">Adresse manquante</span>') +
        '</div>'
      : '<div class="champs">' +
          (r.numero_opq ? '<b>OPQ</b> ' + r.numero_opq : '<span style="color:var(--rouge)">N° OPQ manquant</span>') + '<br>' +
          (r.ville_base || '—') +
        '</div>';

    const pct = r.champs_total ? Math.round(100 * r.champs_remplis / r.champs_total) : 0;
    const complet = '<span class="complet ' + (pct>=100?'plein':'partiel') + '">' + r.champs_remplis + ' / ' + r.champs_total + ' champs (' + pct + '%)</span>';

    const contact = '<div class="champs">' + (r.courriel||'—') + '<br>' + (r.telephone ? cdTelAffiche(r.telephone) : '—') + '</div>';

    const inscrit = r.cree_le ? new Date(r.cree_le).toLocaleDateString('fr-CA') : '—';

    let statutHtml = '<span class="badge ' + r.statut_verification + '">' + (LIB_STATUT[r.statut_verification]||r.statut_verification) + '</span>';
    if(r.verification_raison || r.verification_par_nom){
      statutHtml += '<div class="raison-txt">' +
        (r.verification_par_nom ? 'par ' + r.verification_par_nom + (r.verification_maj_le ? ' · ' + new Date(r.verification_maj_le).toLocaleDateString('fr-CA') : '') + '<br>' : '') +
        (r.verification_raison ? '« ' + r.verification_raison.replace(/</g,'&lt;') + ' »' : '') +
      '</div>';
    }

    const nomTd = document.createElement('td');
    nomTd.innerHTML = '<b>' + nomDe(r).replace(/</g,'&lt;') + '</b><br><a href="/admin-utilisateur.html?id=' + r.id + '" style="font-size:10.5px;color:var(--vert-vif);text-decoration:underline;text-underline-offset:2px">Fiche complète →</a>';

    tr.append(td(role), nomTd, td(identifiants), td(complet), td(contact), td(inscrit), td(statutHtml));

    const act = document.createElement('td');
    const boite = document.createElement('div');
    boite.className = 'actions';

    const bouton = (libelle, classe, fn)=>{
      const b = document.createElement('button');
      b.className = 'btn-a ' + (classe||'');
      b.textContent = libelle;
      b.onclick = fn;
      return b;
    };

    async function appliquer(statut, raisonObligatoire){
      let raison = null;
      if(raisonObligatoire){
        raison = prompt('Raison (obligatoire, communiquée à l\'audit) :');
        if(raison === null || !raison.trim()) return;
      }
      const { error } = await sb.rpc('admin_maj_verification', { p_profil: r.id, p_statut: statut, p_raison: raison });
      if(error){ cdToast('Échec : ' + error.message, false); return; }
      cdToast(nomDe(r) + ' → ' + (LIB_STATUT[statut]||statut) + ' ✓', true);
      await charger();
    }

    if(r.statut_verification === 'en_attente'){
      boite.append(
        bouton('Approuver','oui', ()=>appliquer('verifie', false)),
        bouton('Rejeter','non', ()=>appliquer('rejete', true)),
        bouton('Demander plus d\'info','', ()=>appliquer('en_attente', true))
      );
    } else if(r.statut_verification === 'verifie'){
      boite.append(bouton('Suspendre','non', ()=>appliquer('suspendu', true)));
    } else if(r.statut_verification === 'rejete'){
      boite.append(bouton('Reconsidérer','', ()=>appliquer('en_attente', false)), bouton('Approuver','oui', ()=>appliquer('verifie', false)));
    } else if(r.statut_verification === 'suspendu'){
      boite.append(bouton('Réactiver','oui', ()=>appliquer('verifie', false)), bouton('Rejeter','non', ()=>appliquer('rejete', true)));
    }
    act.appendChild(boite);
    tr.appendChild(act);
    tb.appendChild(tr);
  });
}
</script>
</body>
</html>
