# =====================================================================
# C-DIRECT — Worker "c-direct-payments"
# Worker séparé du déploiement Pages et des autres Workers (le site
# statique n'est pas touché). Squelette seulement pour l'instant — les
# routes Stripe (create-auth-hold, capture-auth-hold, void-auth-hold,
# webhooks Connect) seront ajoutées dans une passe dédiée, en suivant
# la documentation Stripe officielle pour chaque étape.
# Déployer depuis CE dossier : npx wrangler deploy
# Secrets (JAMAIS ici, JAMAIS dans git) : npx wrangler secret put <NOM>
# =====================================================================
name = "c-direct-payments"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Télémétrie Wrangler désactivée pour ce projet (2026-08-18). Elle est déjà
# coupée globalement sur la machine de Robert ; on la fixe aussi ici pour que
# le réglage suive le dépôt et s'applique à toute machine qui déploierait ce
# Worker. Voir github.com/cloudflare/workers-sdk → packages/wrangler/telemetry.md
send_metrics = false

# Secrets attendus (à ajouter via `wrangler secret put`, pas ici) :
#   STRIPE_SECRET_KEY         → clé secrète Stripe (sk_test_... en sandbox)
#   STRIPE_WEBHOOK_SECRET     → signature des webhooks Connect (whsec_...)
#   SUPABASE_URL              → https://fenlujjozanerbzyypjt.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY → Supabase → Settings → API → service_role

# Cron Triggers — cycle garanties de paiement (sql/43 + executerCycleGaranties
# dans src/index.js) : crée les autorisations T-24h dues, fixe les délais de
# confirmation à l'envoi de facture, capture les garanties échues. Toutes les
# 15 min, même cadence que le cron hausses-auto de Supabase (sql/30).
# Échelle de relance (T-18h retry / SMS T-12h / escalade T-6h) construite
# sql/46 + index.js (calculerProchainePhase) — carte de secours toujours
# PAS construite (pas de 2e carte en DB). Ce trigger nécessite le plan
# Workers Paid (le compte a déjà 5 crons via c-direct-sms, plafond gratuit) —
# voir project memory si absent au dashboard.
[triggers]
crons = ["*/15 * * * *"]
