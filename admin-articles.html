<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Direct — Dispensaire (articles)</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3.5" fill="%230B6E4F"/><g fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.2v8.4M5.4 12.4h5.2M3.6 4.8h8.8"/><path d="M3.6 4.8 2.3 7.6a1.45 1.45 0 0 0 2.7 0Z"/><path d="M12.4 4.8l-1.35 2.8a1.45 1.45 0 0 0 2.7 0Z"/></g></svg>'>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#FAFBF9;--panneau:#FFFFFF;--panneau2:#F1F6F2;--ligne:#D5E3DB;--ligne2:#C3D6CB;--vert:#0B6E4F;--vert-vif:#0E8A62;--texte:#1B2622;--sourd:#5A6B63;--jaune:#C97B12;--rouge:#C0392B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
background-image:linear-gradient(rgba(232,184,73,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(232,184,73,.03) 1px,transparent 1px);background-size:44px 44px}
.topbar{border-bottom:1px solid var(--ligne);background:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
.topbar .in{max-width:1400px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.12em}
.croix{width:28px;height:28px;display:grid;place-items:center;background:var(--jaune);border-radius:5px;flex:none}
.topbar .droite{display:flex;align-items:center;gap:10px;color:var(--sourd);min-width:0;flex-wrap:nowrap}
.wrap{max-width:900px;margin:0 auto;padding:36px 18px 70px}
h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
h1 b{color:var(--jaune)}
.sous{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:22px}
.carte{background:var(--panneau);border:1px solid var(--ligne);border-radius:8px;padding:24px;position:relative;margin-bottom:20px}
.carte::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--jaune),transparent)}
.sec{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--jaune);margin-bottom:14px}
.champ{margin-bottom:12px}
.champ label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sourd);margin-bottom:5px}
.champ input,.champ select,.champ textarea{width:100%;border:1px solid var(--ligne2);border-radius:4px;padding:11px 12px;font-size:14px;font-family:'IBM Plex Mono',monospace;background:#F4F8F5;color:var(--texte)}
.champ input:focus,.champ select:focus,.champ textarea:focus{outline:none;border-color:var(--jaune);box-shadow:0 0 0 2px rgba(232,184,73,.18)}
.champ textarea{min-height:160px;resize:vertical;font-family:'Instrument Sans',sans-serif;font-size:14px}
.consent{display:flex;align-items:center;gap:8px;font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--sourd);margin:6px 0 12px;cursor:pointer}
.btn{background:var(--jaune);color:#1A1405;border:none;border-radius:5px;padding:11px 18px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn:hover{filter:brightness(.95)}
.btn:disabled{opacity:.55;cursor:default}
.msg{display:none;border-radius:4px;padding:10px 12px;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:12px}
.msg.ok{background:rgba(18,169,110,.1);color:var(--vert-vif);border:1px solid var(--ligne2);border-left:3px solid var(--vert)}
.msg.ko{background:rgba(229,72,77,.08);color:var(--rouge);border:1px solid rgba(229,72,77,.35);border-left:3px solid var(--rouge)}
.liste{display:flex;flex-direction:column;gap:10px}
.art{border:1px solid var(--ligne2);border-radius:6px;padding:14px 16px;background:var(--panneau2)}
.art .tete{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.art .titre{font-weight:700;flex:1 1 auto;min-width:180px}
.cat{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px;border:1px solid var(--ligne2);color:var(--sourd)}
.etat{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:3px}
.etat.publie{color:var(--vert-vif);border:1px solid rgba(23,201,128,.4);background:rgba(18,169,110,.08)}
.etat.brouillon{color:var(--sourd);border:1px solid var(--ligne2)}
.art .corps-apercu{color:var(--sourd);font-size:13px;margin-top:6px;max-height:2.8em;overflow:hidden}
.art .actions{display:flex;gap:8px;margin-top:10px}
.btn-mini{background:transparent;border:1px solid var(--ligne2);color:var(--sourd);border-radius:4px;padding:6px 12px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.btn-mini:hover{border-color:var(--jaune);color:var(--jaune)}
.btn-mini.rouge:hover{border-color:rgba(229,72,77,.5);color:var(--rouge)}
.vide{text-align:center;color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:20px 0}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
</head>
<body>

<div class="topbar">
  <div class="in">
    <a class="brand" href="/index.html">
      <span class="croix"><svg width="15" height="15" viewBox="0 0 16 16"><g fill="none" stroke="#1A1405" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6v9.6M4.9 13.4h6.2M3 4.4h10"/><path d="M3 4.4 1.5 7.7a1.7 1.7 0 0 0 3.1 0Z"/><path d="M13 4.4l-1.55 3.3a1.7 1.7 0 0 0 3.1 0Z"/></g></svg></span>
      C-DIRECT
    </a>
    <div class="droite"></div>
  </div>
</div>

<div class="wrap">
  <h1>Dispensaire <b>·</b> Articles</h1>
  <p class="sous">Contenu affiché aux pharmaciens et pharmacies sur /dispensaire.html — rien n'apparaît côté lecteur tant qu'un article n'est pas publié.</p>

  <div class="carte">
    <div class="sec" id="titre-form">Nouvel article</div>
    <input type="hidden" id="edit-id">
    <div class="champ"><label>Titre</label><input id="f-titre" placeholder="Ex. : Comprendre vos obligations fiscales comme remplaçant"></div>
    <div class="champ"><label>Catégorie</label>
      <select id="f-categorie">
        <option value="carriere">Carrière</option>
        <option value="finances">Finances</option>
        <option value="patients">Patients / clients</option>
      </select>
    </div>
    <div class="champ"><label>Contenu</label><textarea id="f-corps" placeholder="Texte de l'article…"></textarea></div>
    <label class="consent"><input type="checkbox" id="f-publie"> Publier immédiatement (visible dans le Dispensaire dès l'enregistrement)</label>
    <button class="btn" id="btn-enregistrer">Enregistrer</button>
    <button class="btn-mini" id="btn-annuler" style="display:none;margin-left:8px">Annuler la modification</button>
    <div class="msg" id="msg"></div>
  </div>

  <div class="carte">
    <div class="sec" id="n-articles">Chargement…</div>
    <div class="liste" id="liste"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js?v=20260726a"></script>
<script src="/auth.js?v=20260729b"></script>
<script>
const sb = window.sbClient;
const $ = id => document.getElementById(id);
const LIB_CAT = { carriere:'Carrière', finances:'Finances', patients:'Patients / clients' };
let profil = null;

function msg(texte, ok){
  const el = $('msg'); el.textContent = texte;
  el.className = 'msg ' + (ok ? 'ok' : 'ko'); el.style.display = 'block';
  if(ok) setTimeout(()=>{ el.style.display='none'; }, 4000);
}

function viderForm(){
  $('edit-id').value=''; $('f-titre').value=''; $('f-categorie').value='carriere';
  $('f-corps').value=''; $('f-publie').checked=false;
  $('titre-form').textContent='Nouvel article'; $('btn-annuler').style.display='none';
}

async function charger(){
  const { data, error } = await sb.from('articles').select('*').order('created_at', { ascending:false });
  const liste = $('liste');
  if(error){ liste.innerHTML = '<div class="vide">Erreur : '+error.message+'</div>'; return; }
  if(!data || !data.length){ $('n-articles').textContent = 'Aucun article pour l\'instant'; liste.innerHTML = '<div class="vide">Rien n\'a encore été écrit — le formulaire ci-dessus ajoute le premier.</div>'; return; }
  $('n-articles').textContent = data.length + ' article' + (data.length>1?'s':'');
  liste.innerHTML = '';
  data.forEach(a=>{
    const div = document.createElement('div'); div.className = 'art';
    div.innerHTML =
      '<div class="tete"><span class="titre"></span><span class="cat"></span>' +
      '<span class="etat '+(a.publie?'publie':'brouillon')+'">'+(a.publie?'Publié':'Brouillon')+'</span></div>' +
      '<div class="corps-apercu"></div>' +
      '<div class="actions"><button class="btn-mini" data-a="modifier">Modifier</button>' +
      '<button class="btn-mini" data-a="basculer">'+(a.publie?'Repasser en brouillon':'Publier')+'</button>' +
      '<button class="btn-mini rouge" data-a="supprimer">Supprimer</button></div>';
    div.querySelector('.titre').textContent = a.titre;
    div.querySelector('.cat').textContent = LIB_CAT[a.categorie] || a.categorie;
    div.querySelector('.corps-apercu').textContent = a.corps;
    div.querySelector('[data-a=modifier]').onclick = ()=>{
      $('edit-id').value = a.id; $('f-titre').value = a.titre; $('f-categorie').value = a.categorie;
      $('f-corps').value = a.corps; $('f-publie').checked = a.publie;
      $('titre-form').textContent = 'Modifier l\'article'; $('btn-annuler').style.display = '';
      window.scrollTo({top:0, behavior:'smooth'});
    };
    div.querySelector('[data-a=basculer]').onclick = async ()=>{
      const { error:e } = await sb.from('articles').update({ publie: !a.publie, updated_at:new Date().toISOString() }).eq('id', a.id);
      if(e){ msg('Erreur : '+e.message, false); return; }
      charger();
    };
    div.querySelector('[data-a=supprimer]').onclick = async ()=>{
      if(!confirm('Supprimer définitivement « '+a.titre+' » ?')) return;
      const { error:e } = await sb.from('articles').delete().eq('id', a.id);
      if(e){ msg('Erreur : '+e.message, false); return; }
      charger();
    };
    liste.appendChild(div);
  });
}

$('btn-annuler').onclick = viderForm;

$('btn-enregistrer').onclick = async ()=>{
  const titre = $('f-titre').value.trim();
  const corps = $('f-corps').value.trim();
  if(!titre || !corps){ msg('Titre et contenu sont requis.', false); return; }
  const payload = {
    titre, corps,
    categorie: $('f-categorie').value,
    publie: $('f-publie').checked
  };
  $('btn-enregistrer').disabled = true;
  const id = $('edit-id').value;
  let error;
  if(id){
    ({ error } = await sb.from('articles').update({ ...payload, updated_at:new Date().toISOString() }).eq('id', id));
  } else {
    payload.cree_par = profil.id;
    ({ error } = await sb.from('articles').insert(payload));
  }
  $('btn-enregistrer').disabled = false;
  if(error){ msg('Erreur : '+error.message, false); return; }
  msg(id ? 'Article mis à jour ✓' : 'Article créé ✓', true);
  viderForm();
  charger();
};

(async function(){
  profil = await cdExigerConnexion(['admin']);
  cdEnteteConnecte();
  charger();
})();
</script>
</body>
</html>
