<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Direct — Calendrier de la pharmacie</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3.5" fill="%230B6E4F"/><g fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.2v8.4M5.4 12.4h5.2M3.6 4.8h8.8"/><path d="M3.6 4.8 2.3 7.6a1.45 1.45 0 0 0 2.7 0Z"/><path d="M12.4 4.8l-1.35 2.8a1.45 1.45 0 0 0 2.7 0Z"/></g></svg>'>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#FAFBF9;--panneau:#FFFFFF;--panneau2:#F1F6F2;--ligne:#D5E3DB;--ligne2:#C3D6CB;--vert:#0B6E4F;--vert-vif:#0E8A62;--texte:#1B2622;--sourd:#5A6B63;--jaune:#C97B12;--rouge:#C0392B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5;min-height:100vh;background-image:linear-gradient(rgba(18,169,110,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(18,169,110,.035) 1px,transparent 1px);background-size:44px 44px}
.topbar{border-bottom:1px solid var(--ligne);background:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
.topbar .in{max-width:1600px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.12em}
.croix{width:28px;height:28px;display:grid;place-items:center;background:var(--vert);border-radius:5px;flex:none}
.topbar .droite{display:flex;align-items:center;gap:10px;min-width:0}
.topbar a.nav{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sourd);text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
.topbar a.nav:hover{color:var(--vert-vif)}
.wrap{max-width:1560px;margin:0 auto;padding:30px 20px 60px}
h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.sous{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:18px}

.entete-outils{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.vues{display:flex;border:1px solid var(--ligne2);border-radius:7px;overflow:hidden}
.vues button{background:var(--panneau);border:none;color:var(--sourd);padding:8px 16px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.vues button.actif{background:var(--vert);color:#fff}
.vues button:not(.actif):hover{background:var(--panneau2)}
.imprimer{margin-left:auto;display:flex;gap:8px}
.bimp{background:transparent;border:1px solid var(--ligne2);color:var(--sourd);border-radius:7px;padding:8px 14px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.bimp:hover{border-color:var(--vert);color:var(--vert-vif)}

.grille-principale{display:grid;grid-template-columns:1.35fr 1fr;gap:20px;align-items:start}
@media(max-width:980px){.grille-principale{grid-template-columns:1fr}}

.carte{background:var(--panneau);border:1px solid var(--ligne);border-radius:8px;padding:22px;position:relative}
.carte::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--vert),transparent)}
.carte + .carte{margin-top:20px}

/* --- calendrier : vue mois --- */
.nav-mois{display:flex;gap:8px;align-items:center}
.bnav{background:var(--panneau2);border:1px solid var(--ligne2);color:var(--texte);border-radius:5px;width:34px;height:34px;font-size:16px;cursor:pointer;font-family:'IBM Plex Mono',monospace}
.bnav:hover{border-color:var(--vert)}
.bauj{background:transparent;border:1px solid var(--ligne2);color:var(--sourd);border-radius:5px;padding:0 12px;height:34px;font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.bauj:hover{border-color:var(--vert);color:var(--vert-vif)}
.cal-mois{font-family:'IBM Plex Mono',monospace;font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:capitalize}
.grille-jours{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.jour-tete{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--sourd);text-align:center;padding:6px 0}
.jour{aspect-ratio:1/1;min-height:92px;border:1px solid var(--ligne);border-radius:7px;background:var(--panneau2);display:flex;flex-direction:column;align-items:flex-start;padding:8px 9px;position:relative;overflow:hidden}
.jour.vide{background:transparent;border-color:transparent}
.jour.auj{box-shadow:inset 0 0 0 1px var(--jaune)}
.jour.a-contrat{border-color:var(--vert)}
.jour.a-ouvert{border-color:var(--ligne2);border-style:dashed}
.jour.a-annule{border-color:rgba(192,57,43,.4);border-style:dashed}
.jour .n{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:600}
.pastille{margin-top:4px;display:block;font-family:'IBM Plex Mono',monospace;font-size:8.5px;letter-spacing:.02em;padding:2px 5px;border-radius:3px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-decoration:none;cursor:pointer}
.pastille.ouvert{background:rgba(126,148,138,.12);color:var(--sourd);border:1px dashed var(--ligne2)}
.pastille.attribue{background:rgba(232,184,73,.16);color:var(--jaune);border:1px solid rgba(232,184,73,.4)}
.pastille.complete{background:rgba(18,169,110,.16);color:var(--vert-vif);border:1px solid rgba(23,201,128,.4)}
.pastille.annule{background:rgba(192,57,43,.12);color:var(--rouge);border:1px solid rgba(192,57,43,.35);text-decoration:line-through}
.pastille:hover{filter:brightness(1.2)}
.plus{font-family:'IBM Plex Mono',monospace;font-size:8px;color:var(--sourd);margin-top:2px}
.legende{display:flex;gap:16px;flex-wrap:wrap;margin-top:16px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sourd)}
.legende span{display:inline-flex;align-items:center;gap:7px}
.pnt{width:11px;height:11px;border-radius:3px;display:inline-block}
.pnt.ouvert{background:rgba(126,148,138,.12);border:1px dashed var(--ligne2)}
.pnt.attribue{background:rgba(232,184,73,.16);border:1px solid rgba(232,184,73,.4)}
.pnt.complete{background:rgba(18,169,110,.16);border:1px solid rgba(23,201,128,.4)}
.pnt.annule{background:rgba(192,57,43,.12);border:1px solid rgba(192,57,43,.35)}

/* --- calendrier : vue année --- */
.annee-lbl{font-family:'IBM Plex Mono',monospace;font-size:14px;font-weight:700;letter-spacing:.06em;min-width:52px;text-align:center}
.grille-annee{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.grille-annee{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.grille-annee{grid-template-columns:1fr}}
.mini-mois{border:1px solid var(--ligne);border-radius:7px;padding:10px;break-inside:avoid}
.mini-titre{font-family:'IBM Plex Mono',monospace;font-size:11.5px;font-weight:700;text-transform:capitalize;text-align:center;margin-bottom:7px;letter-spacing:.06em}
.mini-grille{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.mini-jt{font-family:'IBM Plex Mono',monospace;font-size:7.5px;color:var(--sourd);text-align:center;letter-spacing:.03em;padding-bottom:2px}
.mini-j{aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono',monospace;font-size:9.5px;position:relative;border-radius:3px;cursor:pointer}
.mini-j.vide{cursor:default}
.mini-j.auj{box-shadow:inset 0 0 0 1px var(--jaune)}
.mini-j:hover:not(.vide){background:var(--panneau2)}
.mini-j .pt{position:absolute;bottom:1px;width:4px;height:4px;border-radius:50%}
.mini-j .pt.attribue{background:var(--jaune)}
.mini-j .pt.complete{background:var(--vert-vif)}
.mini-j .pt.ouvert{background:var(--sourd)}
.mini-j .pt.annule{background:var(--rouge)}

/* --- panneau contrats --- */
.sec{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--vert-vif);margin-bottom:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec small{color:var(--sourd);text-transform:none;letter-spacing:.04em;font-size:11px}
.onglets{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.onglet{background:transparent;border:1px solid var(--ligne2);color:var(--sourd);border-radius:99px;padding:7px 13px;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer}
.onglet:hover{border-color:var(--vert)}
.onglet.actif{background:var(--vert);border-color:var(--vert);color:#fff}
.liste-scroll{max-height:640px;overflow-y:auto;padding-right:4px}
.ligne-contrat{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--panneau2);text-decoration:none;color:inherit}
.ligne-contrat:last-child{border-bottom:none}
.ligne-contrat:hover{background:var(--panneau2)}
.lc-date{font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;min-width:60px}
.lc-mid{flex:1;min-width:0}
.lc-ref{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--vert-vif);font-weight:700;display:block}
.lc-meta{font-size:11.5px;color:var(--sourd);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.chip{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--ligne2);color:var(--sourd);flex:none}
.chip.ouvert{color:var(--sourd)}
.chip.attribue{color:var(--jaune);border-color:rgba(232,184,73,.4);background:rgba(232,184,73,.08)}
.chip.complete{color:var(--vert-vif);border-color:rgba(23,201,128,.4);background:rgba(18,169,110,.08)}
.chip.annule{color:var(--rouge);border-color:rgba(229,72,77,.35);background:rgba(229,72,77,.07)}
.vide{text-align:center;color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12px;padding:30px 0}

.chargement{padding:40px;text-align:center;color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase}

@media print{
  .topbar,.no-print{display:none!important}
  body{background:#fff}
  .wrap{max-width:none;padding:0}
  .grille-principale{display:block}
  .carte{border:none;padding:0;box-shadow:none}
  .carte::before{display:none}
  .carte + .carte{margin-top:14px}
  body.print-cal .col-contrats{display:none!important}
  body.print-liste .col-calendrier{display:none!important}
  .liste-scroll{max-height:none!important;overflow:visible!important}
  .mini-mois{border-color:#ccc}
}
</style>

</head>
<body>
<div class="topbar">
  <div class="in">
    <a class="brand" href="/index.html"><span class="croix"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6v9.6M4.9 13.4h6.2M3 4.4h10"/><path d="M3 4.4 1.5 7.7a1.7 1.7 0 0 0 3.1 0Z"/><path d="M13 4.4l-1.55 3.3a1.7 1.7 0 0 0 3.1 0Z"/></svg></span>C-DIRECT</a>
    <div class="droite"></div>
  </div>
</div>
<div class="wrap">
  <h1>Calendrier</h1>
  <p class="sous">Vos contrats par journée — demandes publiées, confirmés, complétés et annulés.</p>

  <div class="chargement" id="chargement">Chargement du calendrier…</div>

  <div id="corps" style="display:none">
    <div class="entete-outils no-print">
      <div class="vues">
        <button id="v-mois" class="actif" type="button">Mois</button>
        <button id="v-annee" type="button">Année</button>
      </div>
      <div class="nav-mois" id="nav-mois">
        <button class="bauj" id="b-auj" type="button">Aujourd'hui</button>
        <button class="bnav" id="b-prev" type="button">‹</button>
        <div class="cal-mois" id="mois-lbl" style="min-width:150px;text-align:center">—</div>
        <button class="bnav" id="b-next" type="button">›</button>
      </div>
      <div class="nav-mois" id="nav-annee" style="display:none">
        <button class="bnav" id="ba-prev" type="button">‹</button>
        <div class="annee-lbl" id="annee-lbl">—</div>
        <button class="bnav" id="ba-next" type="button">›</button>
      </div>
      <div class="imprimer">
        <button class="bimp" id="b-imp-cal" type="button">Imprimer le calendrier</button>
        <button class="bimp" id="b-imp-liste" type="button">Imprimer la liste</button>
      </div>
    </div>

    <div class="grille-principale">
      <div class="col-calendrier">
        <div class="carte" id="vue-mois">
          <div class="grille-jours" id="jours-tete"></div>
          <div class="grille-jours" id="grille" style="margin-top:7px"></div>
          <div class="legende">
            <span><i class="pnt ouvert"></i> Demande (publié)</span>
            <span><i class="pnt attribue"></i> Confirmé</span>
            <span><i class="pnt complete"></i> Complété</span>
            <span><i class="pnt annule"></i> Annulé</span>
          </div>
        </div>
        <div class="carte" id="vue-annee" style="display:none">
          <div class="grille-annee" id="grille-annee"></div>
          <div class="legende" style="margin-top:18px">
            <span><i class="pnt ouvert"></i> Demande</span>
            <span><i class="pnt attribue"></i> Confirmé</span>
            <span><i class="pnt complete"></i> Complété</span>
            <span><i class="pnt annule"></i> Annulé</span>
          </div>
        </div>
      </div>

      <div class="col-contrats">
        <div class="carte">
          <div class="sec">Contrats<small id="n-contrats"></small></div>
          <div class="onglets no-print" id="onglets">
            <button class="onglet actif" data-onglet="attribue" type="button">Confirmé</button>
            <button class="onglet" data-onglet="ouvert" type="button">Demande</button>
            <button class="onglet" data-onglet="complete" type="button">Complété</button>
            <button class="onglet" data-onglet="annule" type="button">Annulé</button>
          </div>
          <div class="liste-scroll" id="liste"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js?v=20260723b"></script>
<script src="/auth.js?v=20260806c"></script>
<script>
const sb = window.sbClient;
const $ = id => document.getElementById(id);
const JOURS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const JOURS_MINI = ['L','M','M','J','V','S','D'];
const MOIS = ['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const NOM_TAB = {attribue:'Confirmé', ouvert:'Demande', complete:'Complété', annule:'Annulé'};

let profil = null;
let vue = 'mois';                              // 'mois' | 'annee'
let curseur = new Date();                      // mois affiché (vue mois)
let anneeCourante = new Date().getFullYear();  // année affichée (vue année)
let ongletActif = 'attribue';
const parJour = new Map();                     // 'YYYY-MM-DD' -> [contrats]
let contrats = [];

function iso(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function d10(v){ return String(v).slice(0,10); }
function dateCourte(v){
  const d = new Date(d10(v)+'T12:00:00');
  return String(d.getDate()).padStart(2,'0')+' '+MOIS[d.getMonth()].slice(0,3);
}

(async function(){
  profil = await cdExigerConnexion(['pharmacie']);
  cdEnteteConnecte();
  try{
    const { data } = await sb.from('contrats')
      .select('numero_reference,date_contrat,heure_debut,heure_fin,tarif_horaire,statut')
      .eq('pharmacie_id', profil.id)
      .in('statut',['ouvert','attribue','complete','annule']);
    contrats = data || [];
    contrats.forEach(k=>{
      const j = d10(k.date_contrat);
      if(!parJour.has(j)) parJour.set(j, []);
      parJour.get(j).push(k);
    });
  }catch(e){}

  $('chargement').style.display = 'none';
  $('corps').style.display = '';

  const jt = $('jours-tete');
  JOURS.forEach(j=>{ const d=document.createElement('div'); d.className='jour-tete'; d.textContent=j; jt.appendChild(d); });

  $('b-prev').onclick = ()=>{ curseur.setMonth(curseur.getMonth()-1); dessinerMois(); };
  $('b-next').onclick = ()=>{ curseur.setMonth(curseur.getMonth()+1); dessinerMois(); };
  $('b-auj').onclick  = ()=>{ curseur = new Date(); dessinerMois(); };
  $('ba-prev').onclick = ()=>{ anneeCourante--; dessinerAnnee(); };
  $('ba-next').onclick = ()=>{ anneeCourante++; dessinerAnnee(); };

  $('v-mois').onclick  = ()=> basculerVue('mois');
  $('v-annee').onclick = ()=> basculerVue('annee');

  document.querySelectorAll('#onglets button.onglet').forEach(b=>{
    b.onclick = ()=>{
      ongletActif = b.dataset.onglet;
      document.querySelectorAll('#onglets button.onglet').forEach(x=>x.classList.toggle('actif', x===b));
      dessinerListe();
    };
  });

  $('b-imp-cal').onclick   = ()=>{ document.body.classList.add('print-cal');   window.print(); };
  $('b-imp-liste').onclick = ()=>{ document.body.classList.add('print-liste'); window.print(); };
  window.addEventListener('afterprint', ()=> document.body.classList.remove('print-cal','print-liste'));

  dessinerMois();
  dessinerAnnee();
  dessinerListe();
})();

function basculerVue(v){
  vue = v;
  $('v-mois').classList.toggle('actif', v==='mois');
  $('v-annee').classList.toggle('actif', v==='annee');
  $('nav-mois').style.display  = v==='mois'  ? '' : 'none';
  $('nav-annee').style.display = v==='annee' ? '' : 'none';
  $('vue-mois').style.display  = v==='mois'  ? '' : 'none';
  $('vue-annee').style.display = v==='annee' ? '' : 'none';
}

function statutPrioritaire(liste){
  if(liste.some(x=>x.statut==='attribue'||x.statut==='complete')) return 'contrat';
  if(liste.some(x=>x.statut==='ouvert')) return 'ouvert';
  if(liste.some(x=>x.statut==='annule')) return 'annule';
  return null;
}

function dessinerMois(){
  $('mois-lbl').textContent = MOIS[curseur.getMonth()] + ' ' + curseur.getFullYear();
  const grille = $('grille'); grille.innerHTML='';
  const an = curseur.getFullYear(), mo = curseur.getMonth();
  const decal = (new Date(an,mo,1).getDay()+6)%7;
  const nbJours = new Date(an,mo+1,0).getDate();
  const ajd = iso(new Date());
  for(let i=0;i<decal;i++){ const c=document.createElement('div'); c.className='jour vide'; grille.appendChild(c); }
  for(let d=1; d<=nbJours; d++){
    const date = iso(new Date(an,mo,d));
    const cell = document.createElement('div'); cell.className='jour';
    if(date===ajd) cell.classList.add('auj');
    const liste = (parJour.get(date)||[]).slice().sort((a,b)=> (a.statut==='ouvert'?1:0)-(b.statut==='ouvert'?1:0));
    const prio = statutPrioritaire(liste);
    if(prio==='contrat') cell.classList.add('a-contrat');
    else if(prio==='ouvert') cell.classList.add('a-ouvert');
    else if(prio==='annule') cell.classList.add('a-annule');
    const n=document.createElement('div'); n.className='n'; n.textContent=d; cell.appendChild(n);
    liste.slice(0,2).forEach(k=>{
      const a=document.createElement('a'); a.className='pastille '+k.statut; a.textContent=k.numero_reference;
      a.href='/c/'+encodeURIComponent(k.numero_reference); a.title='Voir '+k.numero_reference;
      cell.appendChild(a);
    });
    if(liste.length>2){ const p=document.createElement('div'); p.className='plus'; p.textContent='+'+(liste.length-2); cell.appendChild(p); }
    grille.appendChild(cell);
  }
}

function dessinerAnnee(){
  $('annee-lbl').textContent = anneeCourante;
  const zone = $('grille-annee'); zone.innerHTML='';
  const ajd = iso(new Date());
  for(let m=0; m<12; m++) zone.appendChild(miniMois(anneeCourante, m, ajd));
}

function miniMois(an, mo, ajd){
  const carte = document.createElement('div'); carte.className='mini-mois';
  const titre = document.createElement('div'); titre.className='mini-titre'; titre.textContent = MOIS[mo]; carte.appendChild(titre);
  const grille = document.createElement('div'); grille.className='mini-grille';
  JOURS_MINI.forEach(j=>{ const el=document.createElement('div'); el.className='mini-jt'; el.textContent=j; grille.appendChild(el); });
  const decal = (new Date(an,mo,1).getDay()+6)%7;
  const nbJours = new Date(an,mo+1,0).getDate();
  for(let i=0;i<decal;i++){ const c=document.createElement('div'); c.className='mini-j vide'; grille.appendChild(c); }
  for(let d=1; d<=nbJours; d++){
    const date = iso(new Date(an,mo,d));
    const cell = document.createElement('div'); cell.className='mini-j'; cell.textContent = d;
    if(date===ajd) cell.classList.add('auj');
    const liste = parJour.get(date);
    if(liste && liste.length){
      const p = liste.some(x=>x.statut==='attribue') ? 'attribue'
              : liste.some(x=>x.statut==='complete') ? 'complete'
              : liste.some(x=>x.statut==='ouvert')   ? 'ouvert'  : 'annule';
      const pt=document.createElement('span'); pt.className='pt '+p; cell.appendChild(pt);
    }
    cell.onclick = ()=>{ curseur = new Date(an,mo,d); basculerVue('mois'); dessinerMois(); };
    grille.appendChild(cell);
  }
  carte.appendChild(grille);
  return carte;
}

function dessinerListe(){
  const liste = contrats.filter(k=>k.statut===ongletActif);
  const ascendant = (ongletActif==='ouvert' || ongletActif==='attribue');
  liste.sort((a,b)=>{ const x=d10(a.date_contrat), y=d10(b.date_contrat); return ascendant ? x.localeCompare(y) : y.localeCompare(x); });
  $('n-contrats').textContent = liste.length ? '('+liste.length+')' : '';
  const zone = $('liste');
  if(!liste.length){ zone.innerHTML = '<div class="vide">Aucun contrat — '+NOM_TAB[ongletActif].toLowerCase()+'.</div>'; return; }
  zone.innerHTML = liste.map(k=>{
    const heures = k.heure_debut ? (String(k.heure_debut).slice(0,5)+'–'+String(k.heure_fin||'').slice(0,5)) : '';
    const tarif  = k.tarif_horaire!=null ? Number(k.tarif_horaire).toFixed(2)+' $/h' : '';
    const meta   = [heures, tarif].filter(Boolean).join(' · ');
    return '<a class="ligne-contrat" href="/c/'+encodeURIComponent(k.numero_reference)+'">'
      +'<span class="lc-date">'+dateCourte(k.date_contrat)+'</span>'
      +'<span class="lc-mid"><span class="lc-ref">'+k.numero_reference+'</span><span class="lc-meta">'+meta+'</span></span>'
      +'<span class="chip '+k.statut+'">'+NOM_TAB[k.statut]+'</span>'
      +'</a>';
  }).join('');
}
