<html lang="fr">
<head>

<style>
:root{--fond:#FAFBF9;--panneau:#FFFFFF;--panneau2:#F1F6F2;--ligne:#D5E3DB;--ligne2:#C3D6CB;--vert:#0B6E4F;--vert-vif:#0E8A62;--texte:#1B2622;--sourd:#5A6B63;--jaune:#C97B12;--rouge:#C0392B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
.topbar{border-bottom:1px solid var(--ligne);background:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
.topbar .in{max-width:1400px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.12em}
.croix{width:28px;height:28px;display:grid;place-items:center;background:var(--vert);border-radius:5px;flex:none}
.topbar .droite{display:flex;align-items:center;gap:10px;min-width:0}
.topbar a.nav{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sourd);text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
.topbar a.nav:hover{color:var(--vert-vif)}
.wrap{max-width:640px;margin:0 auto;padding:22px 16px 40px}

.mtete{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mtete h1{font-family:'Instrument Sans',sans-serif;font-weight:600;font-size:22px;letter-spacing:-.01em;text-transform:none}
.faqpill{font-size:12.5px;font-weight:600;color:var(--vert);border:1px solid #BFD8CC;border-radius:20px;padding:6px 13px;text-decoration:none}
.faqpill:hover{background:var(--panneau2)}

.recherche{display:flex;align-items:center;gap:9px;background:#EDF1EF;border-radius:11px;padding:10px 13px;margin-bottom:12px}
.recherche svg{flex:none;color:var(--sourd)}
.recherche input{flex:1;border:none;background:none;font-family:'Instrument Sans',sans-serif;font-size:14.5px;color:var(--texte)}
.recherche input:focus{outline:none}
.recherche input::placeholder{color:var(--sourd)}

.tabs{display:flex;gap:7px;margin-bottom:14px}
.tab{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;font-size:12.5px;font-weight:600;color:var(--vert);background:var(--panneau);border:1px solid #CFE0D7;border-radius:20px;padding:9px 6px;cursor:pointer;white-space:nowrap}
.tab.actif{background:var(--vert);border-color:var(--vert);color:#fff}
.tab .cpt{width:8px;height:8px;border-radius:50%;background:var(--vert)}
.tab.actif .cpt-badge{background:#fff;color:var(--vert)}
.cpt-badge{background:var(--vert);color:#fff;font-size:10.5px;font-weight:600;border-radius:20px;padding:0 6px;line-height:1.5}

.conv{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--texte);border-radius:12px;padding:11px 12px;margin-bottom:3px;background:transparent}
.conv:hover{background:#F0F7F3}
.conv.non-lu{background:#F0F7F3}
.av{flex:none;width:44px;height:44px;border-radius:50%;background:var(--panneau2);color:var(--vert-vif);display:grid;place-items:center;font-family:'Inter',sans-serif;font-weight:600;font-size:15px}
.conv.non-lu .av{background:var(--vert);color:#fff}
.av.av-admin{background:var(--vert);color:#fff}
.conv .corps{flex:1;min-width:0}
.conv .ligne1{display:flex;align-items:center;gap:6px}
.conv .nom{font-family:'Inter',sans-serif;font-weight:500;font-size:14.5px;color:var(--texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.non-lu .nom{font-weight:600}
.conv .note{font-size:11.5px;color:var(--sourd);display:inline-flex;align-items:center;gap:2px;flex:none}
.conv .m{color:var(--sourd);font-size:13px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.non-lu .m{color:var(--texte);font-weight:500}
.conv .meta{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.conv .quand{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--sourd);white-space:nowrap}
.point{width:9px;height:9px;border-radius:99px;background:var(--vert);flex:none}
.mbadge{font-size:10.5px;color:var(--sourd);background:#EDF1EF;border-radius:20px;padding:1px 8px;flex:none}
.mbadge.att{color:#8a5a00;background:#FFF3D6}

.pinned{margin-bottom:10px;background:var(--vert);border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:12px;text-decoration:none}
.pinned .picon{width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;flex:none}
.pinned .ptxt{flex:1;min-width:0}
.pinned .ptitre{display:block;font-size:14px;font-weight:600;color:#fff}
.pinned .paper{display:block;font-size:12.5px;color:#CDE6DB;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pinned .pcount{background:#fff;color:var(--vert);font-size:11px;font-weight:600;border-radius:20px;padding:2px 8px;flex:none}

.vide{color:var(--sourd);font-family:'Instrument Sans',sans-serif;font-size:14px;text-align:center;padding:34px 16px;line-height:1.55}

.conv-tete{display:flex;align-items:center;gap:11px;padding:11px 4px 14px;border-bottom:1px solid #E4EDE8;margin-bottom:12px}
.conv-tete .av{width:40px;height:40px;font-size:13px}
.conv-tete .ct-corps{flex:1;min-width:0}
.conv-tete .ct-nom{display:block;font-family:'Inter',sans-serif;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv-tete .ct-sous{display:block;font-size:12.5px;color:var(--sourd);margin-top:1px}
.retour{display:inline-flex;align-items:center;gap:4px;color:var(--vert-vif);text-decoration:none;font-size:13px;margin-bottom:6px}

.fil{display:flex;flex-direction:column;gap:9px;max-height:60vh;overflow-y:auto;padding:8px 2px 12px}
.jour{align-self:center;font-size:11px;color:var(--sourd);background:#E7EEEA;border-radius:20px;padding:3px 11px;margin:4px 0}
.bulle{max-width:80%;padding:9px 13px;font-size:14px;line-height:1.45;word-wrap:break-word}
.bulle .h{font-size:10.5px;margin-top:3px;text-align:right}
.moi{align-self:flex-end;background:var(--vert);color:#fff;border-radius:14px 14px 4px 14px}
.moi .h{color:#BFE0D2}
.autre{align-self:flex-start;background:var(--panneau);border:1px solid #E4EDE8;border-radius:14px 14px 14px 4px}
.autre .h{color:#8A9A92}

.saisie{display:flex;align-items:center;gap:9px;margin-top:12px;padding-top:12px;border-top:1px solid #E4EDE8}
.saisie textarea{flex:1;background:#EDF1EF;border:1px solid transparent;border-radius:20px;padding:11px 16px;color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:14px;resize:none;min-height:42px;max-height:120px;line-height:1.4}
.saisie textarea:focus{outline:none;border-color:var(--ligne2);background:#fff}
.saisie button{flex:none;width:42px;height:42px;border-radius:50%;background:var(--vert);color:#fff;border:none;display:grid;place-items:center;cursor:pointer}
.saisie button:hover{background:var(--vert-vif)}
.saisie button:disabled{opacity:.5;cursor:default}
.btn-cloture{background:transparent;border:1px solid var(--ligne);color:var(--sourd);border-radius:9px;padding:9px 15px;font:500 13px 'Instrument Sans',sans-serif;cursor:pointer}
.btn-cloture:hover{border-color:var(--vert);color:var(--vert)}
</style>

<div class="topbar">
  <div class="in">
    <a class="brand" href="/index.html"><span class="croix"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6v9.6M4.9 13.4h6.2M3 4.4h10"/><path d="M3 4.4 1.5 7.7a1.7 1.7 0 0 0 3.1 0Z"/><path d="M13 4.4l-1.55 3.3a1.7 1.7 0 0 0 3.1 0Z"/></svg></span>C-DIRECT</a>
    <div class="droite" id="nav"></div>
  </div>
</div>
<div class="wrap" id="wrap"><div class="vide" data-fr="Chargement…" data-en="Loading…">Chargement…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js?v=20260723b"></script>
<script src="/auth.js?v=20260809d"></script>
<script>
const sb = window.sbClient;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
let profil = null, contratId = null, filId = null, filEtat = null, timer = null;
const SVG_SEARCH = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>';
const SVG_SEND = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14 21 3M21 3l-6.5 18a.55.55 0 0 1-1 0L10 14l-7-3.5a.55.55 0 0 1 0-1L21 3"/></svg>';
const SVG_CHEV = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>';
const ICONE_ADMIN = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>';

function refDepuisUrl(){ const q = new URLSearchParams(location.search).get('ref'); return q ? q.toUpperCase() : null; }
function nonActive(e){ return /does not exist|schema cache/i.test((e && e.message) || ''); }
function initialesDe(nom){
  const mots = String(nom||'').trim().split(/\s+/).filter(Boolean);
  if(!mots.length) return '?';
  if(mots.length === 1) return mots[0].slice(0,2).toUpperCase();
  return (mots[0][0] + mots[1][0]).toUpperCase();
}

(async function(){
  profil = await cdExigerConnexion(['pharmacien','pharmacie']);
  cdEnteteConnecte();
  $('nav').innerHTML = (profil.role==='pharmacie'
    ? '<a class="nav" href="/espace-pharmacie.html">'+cdT('Espace','Space')+'</a>'
    : '<a class="nav" href="/contrats.html">'+cdT('Contrats','Contracts')+'</a>');
  const ref = refDepuisUrl();
  const fil = new URLSearchParams(location.search).get('fil');
  const admin = new URLSearchParams(location.search).get('admin');
  if(admin) ouvrirConversationAdmin();
  else if(ref || fil) ouvrirConversation(ref);
  else listerConversations();
})();

/* ---------------- CANAL ADMIN (sql/60) ---------------- */
async function chargerApercuAdmin(){
  const [{ data: msgs }, { data: etat }] = await Promise.all([
    sb.from('messages_admin').select('corps,expediteur_id,created_at')
      .eq('utilisateur_id', profil.id).order('created_at',{ascending:false}).limit(1),
    sb.from('messages_admin_etat').select('utilisateur_vu_le').eq('utilisateur_id', profil.id).maybeSingle()
  ]);
  const dernier = (msgs && msgs[0]) || null;
  const vu = etat && etat.utilisateur_vu_le ? new Date(etat.utilisateur_vu_le) : null;
  const non_lu = !!(dernier && dernier.expediteur_id !== profil.id && (!vu || new Date(dernier.created_at) > vu));
  return { dernier_message: dernier ? dernier.corps : null, dernier_le: dernier ? dernier.created_at : null, non_lu };
}

async function ouvrirConversationAdmin(){
  const wrap = $('wrap');
  wrap.innerHTML =
    '<a class="retour" href="/messages.html">'+SVG_CHEV+' '+cdT('Messagerie','Messages')+'</a>'+
    '<div class="conv-tete"><div class="av av-admin">'+ICONE_ADMIN+'</div>'+
    '<div class="ct-corps"><span class="ct-nom">Équipe C-Direct</span><span class="ct-sous">'+cdT('Une question, un problème — écrivez-nous directement.','A question, a problem — write to us directly.')+'</span></div></div>'+
    '<div class="fil" id="fil"><div class="vide">'+cdT('Chargement…','Loading…')+'</div></div>'+
    '<div class="saisie" id="saisie"><textarea id="txt" placeholder="'+cdT('Votre message…','Your message…')+'" rows="1"></textarea>'+
    '<button id="env" aria-label="'+cdT('Envoyer','Send')+'">'+SVG_SEND+'</button></div>';

  $('env').onclick = envoyerAdmin;
  autoGrow($('txt'));
  $('txt').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); envoyerAdmin(); } });
  await chargerAdmin();
  sb.rpc('marquer_admin_vu').catch(()=>{});
  timer = setInterval(async ()=>{ await chargerAdmin(); sb.rpc('marquer_admin_vu').catch(()=>{}); }, 5000);
}

async function chargerAdmin(){
  const { data, error } = await sb.from('messages_admin').select('id,corps,expediteur_id,created_at')
    .eq('utilisateur_id', profil.id).order('created_at',{ascending:true});
  if(error) return;
  const fil = $('fil'); if(!fil) return;
  if(!data.length){ fil.innerHTML = '<div class="vide">'+cdT('Aucun message pour l’instant. Posez votre question, l’équipe C-Direct répond directement ici.','No message yet. Ask your question — the C-Direct team replies directly here.')+'</div>'; return; }
  fil.innerHTML = rendreBulles(data);
  if(data.length !== dernierN){ fil.scrollTop = fil.scrollHeight; dernierN = data.length; }
}

async function envoyerAdmin(){
  const txt = $('txt'); const corps = txt.value.trim(); if(!corps) return;
  $('env').disabled = true;
  const { error } = await sb.from('messages_admin').insert({ utilisateur_id: profil.id, expediteur_id: profil.id, corps });
  $('env').disabled = false;
  if(error){ alert(cdT('Erreur : ','Error: ')+error.message); return; }
  txt.value = ''; autoGrow(txt);
  await chargerAdmin();
}

/* ---------------- LISTE DES FILS ---------------- */
function ligneConv(f){
  const ferme = f.statut === 'ferme';
  const quand = f.dernier_le ? cdTempsRelatif(f.dernier_le) : '';
  const apercu = f.dernier_message
    ? esc(String(f.dernier_message).slice(0,90)) + (String(f.dernier_message).length>90?'…':'')
    : cdT('Aucun message','No message');
  const jeSuisPharmacie = profil.role === 'pharmacie';
  const moiFerme  = jeSuisPharmacie ? f.cloture_pharmacie : f.cloture_pharmacien;
  const autreFerme= jeSuisPharmacie ? f.cloture_pharmacien : f.cloture_pharmacie;
  let badge = '';
  if(ferme) badge = '<span class="mbadge">'+cdT('Fermée','Closed')+'</span>';
  else if(autreFerme && !moiFerme) badge = '<span class="mbadge att">'+cdT('Clôture demandée','Closure requested')+'</span>';
  else if(moiFerme && !autreFerme) badge = '<span class="mbadge">'+cdT('En attente','Pending')+'</span>';
  const note = (f.contrepartie_note_moyenne != null && f.contrepartie_note_nombre)
    ? '<span class="note">★ '+Number(f.contrepartie_note_moyenne).toFixed(1)+'</span>' : '';
  const nonLu = f.non_lu && !ferme;
  const nom = f.contrepartie_nom || cdT('Contrepartie','Counterparty');
  return '<a class="conv'+(nonLu?' non-lu':'')+'" data-nom="'+esc(nom.toLowerCase())+'" href="/messages.html?fil='+encodeURIComponent(f.fil_id)+'">'
    + '<div class="av">'+esc(initialesDe(nom))+'</div>'
    + '<div class="corps"><div class="ligne1"><span class="nom">'+esc(nom)+'</span>'+note+badge+'</div>'
    + '<div class="m">'+apercu+'</div></div>'
    + '<div class="meta">'+(quand?'<span class="quand">'+quand+'</span>':'')+(nonLu?'<span class="point"></span>':'')+'</div></a>';
}

function montrerTab(nom){
  ['messages','admin','historique'].forEach(t=>{
    const pane = $('pane-'+t), btn = $('tab-'+t);
    if(pane) pane.style.display = (t===nom) ? '' : 'none';
    if(btn) btn.classList.toggle('actif', t===nom);
  });
  filtrerRecherche();
}
function filtrerRecherche(){
  const q = ($('recherche') ? $('recherche').value : '').trim().toLowerCase();
  const paneActif = document.querySelector('[id^="pane-"]:not([style*="display: none"])');
  if(!paneActif) return;
  paneActif.querySelectorAll('.conv').forEach(a=>{
    const nom = a.getAttribute('data-nom') || '';
    a.style.display = (!q || nom.includes(q)) ? '' : 'none';
  });
}

async function listerConversations(){
  const wrap = $('wrap');
  wrap.innerHTML =
    '<div class="mtete"><h1>'+cdT('Messagerie','Messages')+'</h1><a class="faqpill" href="/faq.html">FAQ</a></div>'
    + '<div class="recherche">'+SVG_SEARCH+'<input id="recherche" placeholder="'+cdT('Rechercher une conversation','Search a conversation')+'" autocomplete="off"></div>'
    + '<div class="tabs">'
    +   '<button class="tab actif" id="tab-messages" type="button">'+cdT('Messages','Messages')+' <span id="cpt-messages"></span></button>'
    +   '<button class="tab" id="tab-admin" type="button">Équipe C-Direct <span id="cpt-admin"></span></button>'
    +   '<button class="tab" id="tab-historique" type="button">'+cdT('Historique','History')+'</button>'
    + '</div>'
    + '<div id="pane-messages"><div class="vide">'+cdT('Chargement…','Loading…')+'</div></div>'
    + '<div id="pane-admin" style="display:none"></div>'
    + '<div id="pane-historique" style="display:none"></div>';

  $('tab-messages').onclick = ()=>montrerTab('messages');
  $('tab-admin').onclick = ()=>montrerTab('admin');
  $('tab-historique').onclick = ()=>montrerTab('historique');
  $('recherche').addEventListener('input', filtrerRecherche);

  /* --- onglet Équipe C-Direct --- */
  const apercuAdmin = await chargerApercuAdmin();
  const quandA = apercuAdmin.dernier_le ? cdTempsRelatif(apercuAdmin.dernier_le) : '';
  const apercuA = apercuAdmin.dernier_message
    ? esc(String(apercuAdmin.dernier_message).slice(0,90)) + (String(apercuAdmin.dernier_message).length>90?'…':'')
    : cdT('Écrivez-nous si vous avez une question.','Write to us if you have a question.');
  $('pane-admin').innerHTML =
    '<a class="pinned" href="/messages.html?admin=1">'
    + '<span class="picon">'+ICONE_ADMIN+'</span>'
    + '<span class="ptxt"><span class="ptitre">Équipe C-Direct</span><span class="paper">'+apercuA+'</span></span>'
    + (apercuAdmin.non_lu ? '<span class="pcount">1</span>' : (quandA?'<span class="paper" style="flex:none;color:#CDE6DB">'+quandA+'</span>':''))
    + '</a>';
  if(apercuAdmin.non_lu) $('cpt-admin').outerHTML = '<span id="cpt-admin" class="cpt-badge">1</span>';

  /* --- onglets Messages / Historique --- */
  const { data, error } = await sb.rpc('mes_fils');
  const paneM = $('pane-messages'), paneH = $('pane-historique');
  if(error){
    paneM.innerHTML = '<div class="vide">'
      + (nonActive(error) ? cdT('Messagerie par fil non activée — exécuter <b>sql/23</b> dans Supabase.','Thread messaging not enabled — run <b>sql/23</b> in Supabase.')
                          : cdT('Erreur : ','Error: ')+esc(error.message)) + '</div>';
    return;
  }
  const fils = data || [];
  const ouvertes = fils.filter(f => f.statut !== 'ferme');
  const fermees  = fils.filter(f => f.statut === 'ferme');
  const nbNonLu = ouvertes.filter(f => f.non_lu).length;
  if(nbNonLu) $('cpt-messages').outerHTML = '<span id="cpt-messages" class="cpt-badge">'+nbNonLu+'</span>';

  paneM.innerHTML = ouvertes.length ? ouvertes.map(ligneConv).join('')
    : '<div class="vide">'+cdT('Aucune conversation active.<br>Une conversation s’ouvre dès qu’un contrat est confirmé des deux côtés.','No active conversation.<br>A conversation opens as soon as a contract is confirmed on both sides.')+'</div>';
  paneH.innerHTML = fermees.length ? fermees.map(ligneConv).join('')
    : '<div class="vide">'+cdT('Aucune conversation fermée.','No closed conversation.')+'</div>';
}

/* ---------------- UNE CONVERSATION ---------------- */
async function ouvrirConversation(ref){
  const wrap = $('wrap');
  const filDirect = new URLSearchParams(location.search).get('fil');

  if(filDirect){
    filId = filDirect;
  } else {
    const { data, error } = await sb.rpc('get_contrat_fiche', { p_ref: ref });
    if(error || !data || !data.length){
      wrap.innerHTML = '<a class="retour" href="/messages.html">'+SVG_CHEV+' '+cdT('Messagerie','Messages')+'</a><div class="vide">'+cdT('Conversation introuvable ou accès refusé.','Conversation not found or access denied.')+'</div>'; return;
    }
    const k = data[0];
    contratId = k.id;
    if(!(k.statut==='attribue' || k.statut==='complete')){
      wrap.innerHTML = '<a class="retour" href="/messages.html">'+SVG_CHEV+' '+cdT('Messagerie','Messages')+'</a><div class="vide">'+cdT('La messagerie s’ouvre une fois le contrat confirmé des deux côtés.','Messaging opens once the contract is confirmed on both sides.')+'</div>'; return;
    }
    const { data: fid, error: eF } = await sb.rpc('ouvrir_fil', { p_contrat: contratId });
    if(eF){
      wrap.innerHTML = '<a class="retour" href="/messages.html">'+SVG_CHEV+' '+cdT('Messagerie','Messages')+'</a><div class="vide">'
        + (nonActive(eF) ? cdT('Messagerie par fil non activée — exécuter <b>sql/23</b>.','Thread messaging not enabled — run <b>sql/23</b>.') : esc(eF.message)) + '</div>';
      return;
    }
    filId = fid;
  }

  wrap.innerHTML =
    '<a class="retour" href="/messages.html">'+SVG_CHEV+' '+cdT('Toutes les conversations','All conversations')+'</a>'+
    '<div class="conv-tete"><div class="av" id="h-av"></div>'+
    '<div class="ct-corps"><span class="ct-nom" id="h-titre">'+cdT('Conversation','Conversation')+'</span><span class="ct-sous" id="h-sous"></span></div></div>'+
    '<div id="bandeau"></div>'+
    '<div class="fil" id="fil"><div class="vide">'+cdT('Chargement…','Loading…')+'</div></div>'+
    '<div class="saisie" id="saisie"><textarea id="txt" placeholder="'+cdT('Votre message…','Your message…')+'" rows="1"></textarea>'+
    '<button id="env" aria-label="'+cdT('Envoyer','Send')+'">'+SVG_SEND+'</button></div>'+
    '<div style="margin-top:14px" id="zone-cloture"></div>';

  $('env').onclick = envoyer;
  autoGrow($('txt'));
  $('txt').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); envoyer(); } });
  await rafraichirEtat();
  await charger();
  sb.rpc('marquer_fil_vu', { p_fil: filId }).catch(()=>{});
  timer = setInterval(async ()=>{
    await charger(); await rafraichirEtat();
    sb.rpc('marquer_fil_vu', { p_fil: filId }).catch(()=>{});
  }, 5000);
}

async function rafraichirEtat(){
  const { data } = await sb.rpc('mes_fils');
  const f = (data||[]).find(x => x.fil_id === filId);
  if(!f) return;
  filEtat = f;

  const t = $('h-titre'); if(t) t.textContent = f.contrepartie_nom || cdT('Conversation','Conversation');
  const av = $('h-av'); if(av) av.textContent = initialesDe(f.contrepartie_nom);
  const s = $('h-sous');
  if(s){
    const note = (f.contrepartie_note_moyenne != null && f.contrepartie_note_nombre)
      ? '★ ' + Number(f.contrepartie_note_moyenne).toFixed(1) + ' (' + f.contrepartie_note_nombre + ' ' + cdT('avis','reviews') + ') · '
      : '';
    s.textContent = note + (f.contrat_ref ? f.contrat_ref + ' · ' : '')
      + f.nb_messages + ' ' + cdT('message' + (f.nb_messages>1?'s':''),'message' + (f.nb_messages>1?'s':''));
  }

  const jeSuisPharmacie = profil.role === 'pharmacie';
  const moiFerme   = jeSuisPharmacie ? f.cloture_pharmacie  : f.cloture_pharmacien;
  const autreFerme = jeSuisPharmacie ? f.cloture_pharmacien : f.cloture_pharmacie;
  const ferme = f.statut === 'ferme';

  const bandeau = $('bandeau');
  const zone = $('zone-cloture');
  const saisie = $('saisie');
  if(!bandeau || !zone) return;

  const boite = (fond, bord, txt) =>
    '<div style="background:'+fond+';border:1px solid '+bord+';border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px">'+txt+'</div>';

  if(ferme){
    bandeau.innerHTML = boite('#F4F6F5','var(--ligne)',
      cdT('<b>Cette conversation est fermée.</b> L’historique reste consultable. Une nouvelle conversation s’ouvrira automatiquement lors d’un prochain contrat ensemble.',
          '<b>This conversation is closed.</b> The history remains viewable. A new conversation will open automatically on your next contract together.'));
    if(saisie) saisie.style.display = 'none';
    zone.innerHTML = '';
    return;
  }
  if(saisie) saisie.style.display = '';

  if(autreFerme && !moiFerme){
    bandeau.innerHTML = boite('#FFF8EC','#F0DFC0',
      cdT('<b>L’autre partie souhaite clore cette conversation.</b> Elle restera ouverte tant que vous ne l’acceptez pas — prenez le temps de finir ce que vous aviez à vous dire.',
          '<b>The other party wants to close this conversation.</b> It stays open until you accept — take the time to finish what you had to say.'));
    zone.innerHTML = '<button class="btn-cloture" id="b-clore">'+cdT('Accepter de clore','Accept closing')+'</button>';
  } else if(moiFerme && !autreFerme){
    bandeau.innerHTML = boite('#F4F6F5','var(--ligne)',
      cdT('Vous avez demandé la clôture. En attente de l’accord de l’autre partie — vous pouvez continuer d’écrire d’ici là.',
          'You requested closing. Awaiting the other party\'s agreement — you can keep writing until then.'));
    zone.innerHTML = '<button class="btn-cloture" id="b-annuler">'+cdT('Annuler ma demande','Cancel my request')+'</button>';
  } else {
    bandeau.innerHTML = '';
    zone.innerHTML = '<button class="btn-cloture" id="b-clore">'+cdT('Clore la conversation','Close conversation')+'</button>';
  }

  const bc = $('b-clore'), ba = $('b-annuler');
  if(bc) bc.onclick = () => demanderCloture(true, autreFerme);
  if(ba) ba.onclick = () => demanderCloture(false, false);
}

async function demanderCloture(veut, seraDefinitive){
  if(veut){
    const msg = seraDefinitive
      ? cdT('Clore cette conversation ?\n\n'
        + 'L’autre partie l’a déjà demandé : elle se fermera donc immédiatement.\n'
        + 'Vous ne pourrez plus vous écrire ici. L’historique reste consultable, et une nouvelle\n'
        + 'conversation s’ouvrira lors d’un prochain contrat ensemble.',
          'Close this conversation?\n\n'
        + 'The other party already requested it: it will close immediately.\n'
        + 'You won\'t be able to write here anymore. The history stays viewable, and a new\n'
        + 'conversation will open on your next contract together.')
      : cdT('Demander la clôture de cette conversation ?\n\n'
        + 'Elle ne se fermera que si l’autre partie accepte aussi — vous pouvez continuer\n'
        + 'à écrire entre-temps, et annuler votre demande à tout moment.\n\n'
        + 'Avez-vous bien reçu toutes les informations dont vous avez besoin ?',
          'Request to close this conversation?\n\n'
        + 'It will only close if the other party also accepts — you can keep writing\n'
        + 'in the meantime, and cancel your request at any time.\n\n'
        + 'Have you received all the information you need?');
    if(!confirm(msg)) return;
  }
  const { error } = await sb.rpc('demander_cloture', { p_fil: filId, p_veut: veut });
  if(error){ alert(cdT('Erreur : ','Error: ')+error.message); return; }
  await rafraichirEtat();
  await charger();
}

/* ---------------- bulles + rendu commun ---------------- */
function libelleAutre(){ return profil.role==='pharmacie' ? cdT('Pharmacien(ne)','Pharmacist') : cdT('Pharmacie','Pharmacy'); }
function jourDe(iso){ try{ return new Date(iso).toLocaleDateString(cdLang()==='en'?'en-CA':'fr-CA',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return ''; } }
function rendreBulles(data){
  let html = '', jourCourant = '';
  data.forEach(m=>{
    const j = jourDe(m.created_at);
    if(j && j !== jourCourant){ html += '<div class="jour">'+esc(j)+'</div>'; jourCourant = j; }
    const moi = m.expediteur_id === profil.id;
    const h = cdTempsRelatif(m.created_at);
    html += '<div class="bulle '+(moi?'moi':'autre')+'">'
      + esc(m.corps).replace(/\n/g,'<br>')+'<div class="h">'+h+'</div></div>';
  });
  return html;
}

let dernierN = 0;
async function charger(){
  const { data, error } = await sb.from('messages').select('id,corps,expediteur_id,created_at')
    .eq('fil_id', filId).order('created_at',{ascending:true});
  if(error) return;
  const fil = $('fil'); if(!fil) return;
  if(!data.length){ fil.innerHTML = '<div class="vide">'+cdT('Aucun message. Écrivez le premier — c’est direct, sans intermédiaire.','No message. Write the first — it\'s direct, no middleman.')+'</div>'; return; }
  fil.innerHTML = rendreBulles(data);
  if(data.length !== dernierN){ fil.scrollTop = fil.scrollHeight; dernierN = data.length; }
}

async function envoyer(){
  const txt = $('txt'); const corps = txt.value.trim(); if(!corps) return;
  $('env').disabled = true;
  const ligne = { fil_id: filId, expediteur_id: profil.id, corps };
  if(contratId) ligne.contrat_id = contratId;
  else if(filEtat && filEtat.contrat_ref){
    const { data: k } = await sb.from('contrats').select('id')
      .eq('numero_reference', filEtat.contrat_ref).maybeSingle();
    if(k) ligne.contrat_id = k.id;
  }
  const { error } = await sb.from('messages').insert(ligne);
  $('env').disabled = false;
  if(error){ alert(cdT('Erreur : ','Error: ')+error.message); return; }
  txt.value = ''; autoGrow(txt);
  await charger();
}

function autoGrow(t){
  if(!t) return;
  const fit = ()=>{ t.style.height='auto'; t.style.height=Math.min(t.scrollHeight,120)+'px'; };
  t.addEventListener('input', fit); fit();
}
window.addEventListener('beforeunload', ()=>{ if(timer) clearInterval(timer); });
</script>
