<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Direct — Messagerie</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><rect width="16" height="16" rx="3.5" fill="%230B6E4F"/><g fill="none" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3.2v8.4M5.4 12.4h5.2M3.6 4.8h8.8"/><path d="M3.6 4.8 2.3 7.6a1.45 1.45 0 0 0 2.7 0Z"/><path d="M12.4 4.8l-1.35 2.8a1.45 1.45 0 0 0 2.7 0Z"/></g></svg>'>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#FAFBF9;--panneau:#FFFFFF;--panneau2:#F1F6F2;--ligne:#D5E3DB;--ligne2:#C3D6CB;--vert:#0B6E4F;--vert-vif:#0E8A62;--texte:#1B2622;--sourd:#5A6B63;--jaune:#C97B12;--rouge:#C0392B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5;min-height:100vh}
.topbar{border-bottom:1px solid var(--ligne);background:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
.topbar .in{max-width:1400px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.12em}
.croix{width:28px;height:28px;display:grid;place-items:center;background:var(--vert);border-radius:5px;flex:none}
.topbar .droite{display:flex;align-items:center;gap:10px;min-width:0}
.topbar a.nav{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--sourd);text-decoration:none;letter-spacing:.06em;text-transform:uppercase}
.topbar a.nav:hover{color:var(--vert-vif)}
.wrap{max-width:820px;margin:0 auto;padding:28px 18px 40px}
h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:18px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
.sous{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:20px}
.carte{background:var(--panneau);border:1px solid var(--ligne);border-radius:8px;padding:18px}
.conv{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--texte);border:1px solid var(--ligne);padding:12px 14px;margin-bottom:8px;background:var(--panneau);transition:border-color .12s,background .12s}
.conv:hover{border-color:var(--vert-vif);background:#FBFDFB}
.av{flex:none;width:40px;height:40px;border-radius:50%;background:var(--panneau2);color:var(--vert-vif);display:grid;place-items:center;font-family:'Inter',sans-serif;font-weight:700;font-size:13px}
.av.av-admin{background:var(--vert);color:#fff}
.conv .corps{flex:1;min-width:0}
.conv .ligne1{display:flex;align-items:center;gap:7px}
.conv .nom{font-family:'Inter',sans-serif;font-weight:600;font-size:14.5px;color:var(--texte);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv.non-lu .nom{font-weight:800}
.conv .m{color:var(--sourd);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .meta{flex:none;display:flex;align-items:center;gap:6px}
.conv .quand{font-family:'Inter',sans-serif;font-size:11.5px;color:var(--sourd);white-space:nowrap}
.conv.non-lu .quand{color:var(--vert-vif);font-weight:700}
.point{width:8px;height:8px;border-radius:99px;background:var(--rouge);flex:none}
.fermees-toggle{display:flex;align-items:center;gap:6px;width:100%;text-align:left;background:none;border:none;color:var(--sourd);font-family:'Inter',sans-serif;font-size:13px;font-weight:600;padding:10px 4px;cursor:pointer;margin-top:6px}
.fermees-toggle:hover{color:var(--texte)}
.fermees-toggle .fleche{display:inline-block;transition:transform .15s}
.fermees-toggle.ouvert .fleche{transform:rotate(90deg)}
.btn-cloture{background:transparent;border:1px solid var(--ligne);color:var(--sourd);border-radius:9px;padding:9px 15px;font:500 13px 'Instrument Sans',sans-serif;cursor:pointer}
.btn-cloture:hover{border-color:var(--vert);color:var(--vert)}
.vide{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;text-align:center;padding:30px 0}
.fil{display:flex;flex-direction:column;gap:10px;max-height:60vh;overflow-y:auto;padding:6px 2px 12px}
.bulle{max-width:78%;padding:9px 13px;border-radius:12px;font-size:14px;line-height:1.45;word-wrap:break-word}
.bulle .qui{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.7;margin-bottom:3px}
.bulle .h{font-family:'IBM Plex Mono',monospace;font-size:10px;opacity:.5;margin-top:4px;text-align:right}
.moi{align-self:flex-end;background:rgba(18,169,110,.16);border:1px solid rgba(23,201,128,.4)}
.autre{align-self:flex-start;background:var(--panneau2);border:1px solid var(--ligne2)}
.tete-conv{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.tete-conv .av{width:44px;height:44px;font-size:14px}
.saisie{display:flex;gap:10px;margin-top:14px}
.saisie textarea{flex:1;background:#F4F8F5;border:1px solid var(--ligne2);border-radius:8px;padding:11px 13px;color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:14px;resize:vertical;min-height:46px}
.saisie textarea:focus{outline:none;border-color:var(--vert)}
.saisie button{background:var(--vert);color:#FFFFFF;border:none;border-radius:8px;padding:0 20px;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:12px;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.saisie button:hover{background:var(--vert-vif)}
.saisie button:disabled{opacity:.5;cursor:default}
.retour{display:inline-block;color:var(--vert-vif);text-decoration:none;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:14px}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
</head>
<body>
<div class="topbar">
  <div class="in">
    <a class="brand" href="/index.html"><span class="croix"><svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#fff" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2.6v9.6M4.9 13.4h6.2M3 4.4h10"/><path d="M3 4.4 1.5 7.7a1.7 1.7 0 0 0 3.1 0Z"/><path d="M13 4.4l-1.55 3.3a1.7 1.7 0 0 0 3.1 0Z"/></svg></span>C-DIRECT</a>
    <div class="droite" id="nav"></div>
  </div>
</div>
<div class="wrap" id="wrap"><div class="vide">Chargement…</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js?v=20260723b"></script>
<script src="/auth.js?v=20260808e"></script>
<script>
const sb = window.sbClient;
const $ = id => document.getElementById(id);
const esc = s => String(s==null?'':s).replace(/[<>&]/g, c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));
let profil = null, contratId = null, filId = null, filEtat = null, timer = null;
const ICONE_ADMIN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>';

function refDepuisUrl(){ const q = new URLSearchParams(location.search).get('ref'); return q ? q.toUpperCase() : null; }
function nonActive(e){ return /does not exist|schema cache/i.test((e && e.message) || ''); }
function initialesDe(nom){
  const mots = String(nom||'').trim().split(/\s+/).filter(Boolean);
  if(!mots.length) return '?';
  if(mots.length === 1) return mots[0].slice(0,2).toUpperCase();
  return (mots[0][0] + mots[1][0]).toUpperCase();
}

(async function(){
  profil = await cdExigerConnexion(['pharmacien','pharmacie']);
  cdEnteteConnecte();
  $('nav').innerHTML = (profil.role==='pharmacie'
    ? '<a class="nav" href="/espace-pharmacie.html">Espace</a>'
    : '<a class="nav" href="/contrats.html">Contrats</a>');
  const ref = refDepuisUrl();
  const fil = new URLSearchParams(location.search).get('fil');
  const admin = new URLSearchParams(location.search).get('admin');
  if(admin) ouvrirConversationAdmin();
  else if(ref || fil) ouvrirConversation(ref);
  else listerConversations();
})();

/* ---------------- CANAL ADMIN (sql/60) ----------------
   Une seule conversation, toujours ouverte, entre l'utilisateur et
   « l'équipe C-Direct » — distincte des fils pharmacie<->pharmacien,
   jamais de clôture. */
async function chargerApercuAdmin(){
  const [{ data: msgs }, { data: etat }] = await Promise.all([
    sb.from('messages_admin').select('corps,expediteur_id,created_at')
      .eq('utilisateur_id', profil.id).order('created_at',{ascending:false}).limit(1),
    sb.from('messages_admin_etat').select('utilisateur_vu_le').eq('utilisateur_id', profil.id).maybeSingle()
  ]);
  const dernier = (msgs && msgs[0]) || null;
  const vu = etat && etat.utilisateur_vu_le ? new Date(etat.utilisateur_vu_le) : null;
  const non_lu = !!(dernier && dernier.expediteur_id !== profil.id && (!vu || new Date(dernier.created_at) > vu));
  return { dernier_message: dernier ? dernier.corps : null, dernier_le: dernier ? dernier.created_at : null, non_lu };
}

async function ouvrirConversationAdmin(){
  const wrap = $('wrap');
  wrap.innerHTML =
    '<a class="retour" href="/messages.html">← Toutes les conversations</a>'+
    '<div class="tete-conv"><div class="av av-admin">'+ICONE_ADMIN+'</div>'+
    '<div><h1 style="margin-bottom:1px">Équipe C-Direct</h1><p class="sous" style="margin-bottom:0">Une question, un problème — écrivez-nous directement.</p></div></div>'+
    '<div class="carte"><div class="fil" id="fil"><div class="vide">Chargement…</div></div>'+
    '<div class="saisie" id="saisie"><textarea id="txt" placeholder="Votre message…" rows="1"></textarea>'+
    '<button id="env">Envoyer</button></div></div>';

  $('env').onclick = envoyerAdmin;
  $('txt').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); envoyerAdmin(); } });
  await chargerAdmin();
  sb.rpc('marquer_admin_vu').catch(()=>{});
  timer = setInterval(async ()=>{ await chargerAdmin(); sb.rpc('marquer_admin_vu').catch(()=>{}); }, 5000);
}

async function chargerAdmin(){
  const { data, error } = await sb.from('messages_admin').select('id,corps,expediteur_id,created_at')
    .eq('utilisateur_id', profil.id).order('created_at',{ascending:true});
  if(error) return;
  const fil = $('fil'); if(!fil) return;
  if(!data.length){ fil.innerHTML = '<div class="vide">Aucun message pour l’instant. Posez votre question, l’équipe C-Direct répond directement ici.</div>'; return; }
  fil.innerHTML = data.map(m=>{
    const moi = m.expediteur_id === profil.id;
    const h = cdTempsRelatif(m.created_at);
    return '<div class="bulle '+(moi?'moi':'autre')+'"><div class="qui">'
      + (moi?'Vous':'Équipe C-Direct')+'</div>'
      + esc(m.corps).replace(/\n/g,'<br>')+'<div class="h">'+h+'</div></div>';
  }).join('');
  if(data.length !== dernierN){ fil.scrollTop = fil.scrollHeight; dernierN = data.length; }
}

async function envoyerAdmin(){
  const txt = $('txt'); const corps = txt.value.trim(); if(!corps) return;
  $('env').disabled = true;
  const { error } = await sb.from('messages_admin').insert({ utilisateur_id: profil.id, expediteur_id: profil.id, corps });
  $('env').disabled = false;
  if(error){ alert('Erreur : '+error.message); return; }
  txt.value = '';
  await chargerAdmin();
}

/* ---------------- LISTE DES FILS ----------------
   Un seul fil par contrepartie (et non plus un par contrat) : les
   échanges avec une même pharmacie restent au même endroit. */
function ligneConv(f){
  const ferme = f.statut === 'ferme';
  const quand = f.dernier_le ? cdTempsRelatif(f.dernier_le) : '';
  const apercu = f.dernier_message
    ? esc(String(f.dernier_message).slice(0,90)) + (String(f.dernier_message).length>90?'…':'')
    : 'Aucun message';
  /* demande de clôture en attente de MA réponse ? */
  const jeSuisPharmacie = profil.role === 'pharmacie';
  const moiFerme  = jeSuisPharmacie ? f.cloture_pharmacie : f.cloture_pharmacien;
  const autreFerme= jeSuisPharmacie ? f.cloture_pharmacien : f.cloture_pharmacie;
  let badge = '';
  if(ferme) badge = '<span class="badge" style="color:var(--sourd);background:var(--panneau2)">Fermée</span>';
  else if(autreFerme && !moiFerme) badge = '<span class="badge" style="color:#8a5a00;background:#FFF3D6">Clôture demandée</span>';
  else if(moiFerme && !autreFerme) badge = '<span class="badge" style="color:var(--sourd);background:var(--panneau2)">En attente</span>';
  const nonLu = f.non_lu && !ferme;
  return '<a class="conv'+(nonLu?' non-lu':'')+'" href="/messages.html?fil='+encodeURIComponent(f.fil_id)+'">'
    + '<div class="av">'+esc(initialesDe(f.contrepartie_nom))+'</div>'
    + '<div class="corps"><div class="ligne1"><span class="nom">'+esc(f.contrepartie_nom || 'Contrepartie')+'</span>'+badge+'</div>'
    + '<div class="m">'+apercu+'</div></div>'
    + '<div class="meta">'+(quand?'<span class="quand">'+quand+'</span>':'')+(nonLu?'<span class="point"></span>':'')+'</div></a>';
}

async function listerConversations(){
  const wrap = $('wrap');
  wrap.innerHTML = '<h1>Messagerie</h1>'
    + '<p class="sous">Une seule conversation par contrepartie — tout l’historique au même endroit.</p>'
    + '<div id="carte-admin" style="margin-bottom:14px"></div>'
    + '<div id="liste"><div class="vide">Chargement…</div></div>'
    + '<div id="zone-fermees"></div>';

  const apercuAdmin = await chargerApercuAdmin();
  const quandA = apercuAdmin.dernier_le ? cdTempsRelatif(apercuAdmin.dernier_le) : '';
  const apercuA = apercuAdmin.dernier_message
    ? esc(String(apercuAdmin.dernier_message).slice(0,90)) + (String(apercuAdmin.dernier_message).length>90?'…':'')
    : 'Écrivez-nous si vous avez une question.';
  $('carte-admin').innerHTML = '<a class="conv'+(apercuAdmin.non_lu?' non-lu':'')+'" href="/messages.html?admin=1">'
    + '<div class="av av-admin">'+ICONE_ADMIN+'</div>'
    + '<div class="corps"><div class="ligne1"><span class="nom">Équipe C-Direct</span></div>'
    + '<div class="m">'+apercuA+'</div></div>'
    + '<div class="meta">'+(quandA?'<span class="quand">'+quandA+'</span>':'')+(apercuAdmin.non_lu?'<span class="point"></span>':'')+'</div></a>';

  const { data, error } = await sb.rpc('mes_fils');
  const l = $('liste');
  if(error){
    l.innerHTML = '<div class="vide">'
      + (nonActive(error) ? 'Messagerie par fil non activée — exécuter <b>sql/23</b> dans Supabase.'
                          : 'Erreur : '+esc(error.message)) + '</div>';
    return;
  }
  const fils = data || [];
  if(!fils.length){
    l.innerHTML = '<div class="vide">Aucune conversation — elle s’ouvre dès qu’un contrat est confirmé des deux côtés.</div>';
    return;
  }
  const ouvertes = fils.filter(f => f.statut !== 'ferme');
  const fermees  = fils.filter(f => f.statut === 'ferme');
  l.innerHTML = ouvertes.length ? ouvertes.map(ligneConv).join('')
    : '<div class="vide">Aucune conversation active pour l’instant.</div>';

  if(fermees.length){
    $('zone-fermees').innerHTML = '<button class="fermees-toggle" id="btn-fermees">'
      + '<span class="fleche">▸</span> Fermées ('+fermees.length+')</button>'
      + '<div id="liste-fermees" style="display:none">'+fermees.map(ligneConv).join('')+'</div>';
    $('btn-fermees').onclick = () => {
      const zone = $('liste-fermees'), btn = $('btn-fermees');
      const ouvre = zone.style.display === 'none';
      zone.style.display = ouvre ? '' : 'none';
      btn.classList.toggle('ouvert', ouvre);
    };
  }
}

/* ---------------- UNE CONVERSATION ---------------- */
async function ouvrirConversation(ref){
  const wrap = $('wrap');
  const filDirect = new URLSearchParams(location.search).get('fil');

  if(filDirect){
    filId = filDirect;
  } else {
    const { data, error } = await sb.rpc('get_contrat_fiche', { p_ref: ref });
    if(error || !data || !data.length){
      wrap.innerHTML = '<a class="retour" href="/messages.html">← Messagerie</a><div class="vide">Conversation introuvable ou accès refusé.</div>'; return;
    }
    const k = data[0];
    contratId = k.id;
    if(!(k.statut==='attribue' || k.statut==='complete')){
      wrap.innerHTML = '<a class="retour" href="/messages.html">← Messagerie</a><div class="vide">La messagerie s’ouvre une fois le contrat confirmé des deux côtés.</div>'; return;
    }
    const { data: fid, error: eF } = await sb.rpc('ouvrir_fil', { p_contrat: contratId });
    if(eF){
      wrap.innerHTML = '<a class="retour" href="/messages.html">← Messagerie</a><div class="vide">'
        + (nonActive(eF) ? 'Messagerie par fil non activée — exécuter <b>sql/23</b>.' : esc(eF.message)) + '</div>';
      return;
    }
    filId = fid;
  }

  wrap.innerHTML =
    '<a class="retour" href="/messages.html">← Toutes les conversations</a>'+
    '<div class="tete-conv"><div class="av" id="h-av"></div>'+
    '<div><h1 id="h-titre" style="margin-bottom:1px">Conversation</h1><p class="sous" id="h-sous" style="margin-bottom:0"></p></div></div>'+
    '<div id="bandeau"></div>'+
    '<div class="carte"><div class="fil" id="fil"><div class="vide">Chargement…</div></div>'+
    '<div class="saisie" id="saisie"><textarea id="txt" placeholder="Votre message…" rows="1"></textarea>'+
    '<button id="env">Envoyer</button></div></div>'+
    '<div style="margin-top:14px" id="zone-cloture"></div>';

  $('env').onclick = envoyer;
  $('txt').addEventListener('keydown', e=>{ if(e.key==='Enter' && (e.metaKey||e.ctrlKey)){ e.preventDefault(); envoyer(); } });
  await rafraichirEtat();
  await charger();
  sb.rpc('marquer_fil_vu', { p_fil: filId }).catch(()=>{});
  timer = setInterval(async ()=>{
    await charger(); await rafraichirEtat();
    sb.rpc('marquer_fil_vu', { p_fil: filId }).catch(()=>{});
  }, 5000);
}

/* état du fil (titre, bandeau, bouton de clôture) */
async function rafraichirEtat(){
  const { data } = await sb.rpc('mes_fils');
  const f = (data||[]).find(x => x.fil_id === filId);
  if(!f) return;
  filEtat = f;

  const t = $('h-titre'); if(t) t.textContent = f.contrepartie_nom || 'Conversation';
  const av = $('h-av'); if(av) av.textContent = initialesDe(f.contrepartie_nom);
  const s = $('h-sous');
  if(s){
    const note = (f.contrepartie_note_moyenne != null && f.contrepartie_note_nombre)
      ? '★ ' + Number(f.contrepartie_note_moyenne).toFixed(1) + ' (' + f.contrepartie_note_nombre + ' avis) · '
      : '';
    const fav = f.contrepartie_favoris_nombre
      ? '♥ ' + f.contrepartie_favoris_nombre + ' pharmacie' + (f.contrepartie_favoris_nombre>1?'s':'') + ' favori · '
      : '';
    s.textContent = note + fav + (f.contrat_ref ? 'Depuis '+f.contrat_ref+' · ' : '')
      + f.nb_messages + ' message' + (f.nb_messages>1?'s':'');
  }

  const jeSuisPharmacie = profil.role === 'pharmacie';
  const moiFerme   = jeSuisPharmacie ? f.cloture_pharmacie  : f.cloture_pharmacien;
  const autreFerme = jeSuisPharmacie ? f.cloture_pharmacien : f.cloture_pharmacie;
  const ferme = f.statut === 'ferme';

  const bandeau = $('bandeau');
  const zone = $('zone-cloture');
  const saisie = $('saisie');
  if(!bandeau || !zone) return;

  const boite = (fond, bord, txt) =>
    '<div style="background:'+fond+';border:1px solid '+bord+';border-radius:10px;padding:12px 14px;font-size:13.5px;margin-bottom:14px">'+txt+'</div>';

  if(ferme){
    bandeau.innerHTML = boite('#F4F6F5','var(--ligne)',
      '<b>Cette conversation est fermée.</b> L’historique reste consultable. '
      + 'Une nouvelle conversation s’ouvrira automatiquement lors d’un prochain contrat ensemble.');
    if(saisie) saisie.style.display = 'none';
    zone.innerHTML = '';
    return;
  }
  if(saisie) saisie.style.display = '';

  if(autreFerme && !moiFerme){
    bandeau.innerHTML = boite('#FFF8EC','#F0DFC0',
      '<b>L’autre partie souhaite clore cette conversation.</b> Elle restera ouverte tant que '
      + 'vous ne l’acceptez pas — prenez le temps de finir ce que vous aviez à vous dire.');
    zone.innerHTML = '<button class="btn-cloture" id="b-clore">Accepter de clore</button>';
  } else if(moiFerme && !autreFerme){
    bandeau.innerHTML = boite('#F4F6F5','var(--ligne)',
      'Vous avez demandé la clôture. En attente de l’accord de l’autre partie — '
      + 'vous pouvez continuer d’écrire d’ici là.');
    zone.innerHTML = '<button class="btn-cloture" id="b-annuler">Annuler ma demande</button>';
  } else {
    bandeau.innerHTML = '';
    zone.innerHTML = '<button class="btn-cloture" id="b-clore">Clore la conversation</button>';
  }

  const bc = $('b-clore'), ba = $('b-annuler');
  if(bc) bc.onclick = () => demanderCloture(true, autreFerme);
  if(ba) ba.onclick = () => demanderCloture(false, false);
}

/* clôture mutuelle — avec l'avertissement doux */
async function demanderCloture(veut, seraDefinitive){
  if(veut){
    const msg = seraDefinitive
      ? 'Clore cette conversation ?\n\n'
        + 'L’autre partie l’a déjà demandé : elle se fermera donc immédiatement.\n'
        + 'Vous ne pourrez plus vous écrire ici. L’historique reste consultable, et une nouvelle\n'
        + 'conversation s’ouvrira lors d’un prochain contrat ensemble.'
      : 'Demander la clôture de cette conversation ?\n\n'
        + 'Elle ne se fermera que si l’autre partie accepte aussi — vous pouvez continuer\n'
        + 'à écrire entre-temps, et annuler votre demande à tout moment.\n\n'
        + 'Avez-vous bien reçu toutes les informations dont vous avez besoin ?';
    if(!confirm(msg)) return;
  }
  const { error } = await sb.rpc('demander_cloture', { p_fil: filId, p_veut: veut });
  if(error){ alert('Erreur : '+error.message); return; }
  await rafraichirEtat();
  await charger();
}

let dernierN = 0;
async function charger(){
  const { data, error } = await sb.from('messages').select('id,corps,expediteur_id,created_at')
    .eq('fil_id', filId).order('created_at',{ascending:true});
  if(error) return;
  const fil = $('fil'); if(!fil) return;
  if(!data.length){ fil.innerHTML = '<div class="vide">Aucun message. Écrivez le premier — c’est direct, sans intermédiaire.</div>'; return; }
  fil.innerHTML = data.map(m=>{
    const moi = m.expediteur_id === profil.id;
    const h = cdTempsRelatif(m.created_at);
    return '<div class="bulle '+(moi?'moi':'autre')+'"><div class="qui">'
      + (moi?'Vous':(profil.role==='pharmacie'?'Pharmacien(ne)':'Pharmacie'))+'</div>'
      + esc(m.corps).replace(/\n/g,'<br>')+'<div class="h">'+h+'</div></div>';
  }).join('');
  if(data.length !== dernierN){ fil.scrollTop = fil.scrollHeight; dernierN = data.length; }
}

async function envoyer(){
  const txt = $('txt'); const corps = txt.value.trim(); if(!corps) return;
  $('env').disabled = true;
  const ligne = { fil_id: filId, expediteur_id: profil.id, corps };
  if(contratId) ligne.contrat_id = contratId;          /* compatibilité ancienne colonne */
  else if(filEtat && filEtat.contrat_ref){
    const { data: k } = await sb.from('contrats').select('id')
      .eq('numero_reference', filEtat.contrat_ref).maybeSingle();
    if(k) ligne.contrat_id = k.id;
  }
  const { error } = await sb.from('messages').insert(ligne);
  $('env').disabled = false;
  if(error){ alert('Erreur : '+error.message); return; }
  txt.value = '';
  await charger();
}
window.addEventListener('beforeunload', ()=>{ if(timer) clearInterval(timer); });
