<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>C-Direct — Nouveaux contrats</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#0D2B24">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--fond:#FAFBF9;--panneau:#FFFFFF;--panneau2:#F1F6F2;--ligne:#D5E3DB;--ligne2:#C3D6CB;--vert:#0B6E4F;--vert-vif:#0E8A62;--texte:#1B2622;--sourd:#5A6B63;--jaune:#C97B12;--rouge:#C0392B}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--fond);color:var(--texte);font-family:'Instrument Sans',sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh;
background-image:linear-gradient(rgba(18,169,110,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(18,169,110,.035) 1px,transparent 1px);background-size:44px 44px}
.topbar{border-bottom:1px solid var(--ligne);background:rgba(255,255,255,.88);backdrop-filter:blur(4px)}
.topbar .in{max-width:1400px;margin:0 auto;padding:0 22px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--texte);font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:15px;letter-spacing:.12em}
.croix{width:28px;height:28px;display:grid;place-items:center;background:var(--vert);border-radius:5px;flex:none}
.topbar .droite{display:flex;align-items:center;gap:10px;color:var(--sourd);min-width:0;flex-wrap:nowrap}
.wrap{max-width:820px;margin:0 auto;padding:36px 18px 70px}
h1{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:20px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.sous{color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12.5px;margin-bottom:22px}
.carte{background:var(--panneau);border:1px solid var(--ligne);border-radius:8px;position:relative;overflow:hidden}
.carte::before{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--vert),transparent)}
table{width:100%;border-collapse:collapse;font-family:'IBM Plex Mono',monospace;font-size:13px}
th{padding:12px 14px;text-align:left;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--sourd);border-bottom:1px solid var(--ligne);white-space:nowrap}
td{padding:13px 14px;border-bottom:1px solid var(--ligne);white-space:nowrap}
tbody tr{cursor:pointer}
tbody tr:hover{background:var(--panneau2)}
tbody tr:last-child td{border-bottom:none}
tbody tr.pour-vous{background:rgba(18,169,110,.07)}
tbody tr.pour-vous:hover{background:rgba(18,169,110,.12)}
.ref{color:var(--vert-vif);font-weight:700}
.tarif{font-weight:700}
.badge{display:inline-block;font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid var(--ligne2);color:var(--sourd)}
.badge.match{color:var(--vert-vif);border-color:rgba(23,201,128,.4);background:rgba(18,169,110,.1)}
.badge.ferme{color:var(--sourd)}
.chargement{padding:48px;text-align:center;color:var(--sourd);font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.legende{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--sourd);margin-top:12px}
.legende b{color:var(--vert-vif)}
@media(max-width:600px){.cache-mobile{display:none}td,th{padding:11px 10px}}
</style>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/design.css">
<link rel="stylesheet" href="/apple-dark.css">
</head>
<body>

<div class="topbar">
  <div class="in">
    <a class="brand" href="/index.html">
      <span class="croix"><svg width="15" height="15" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg"><g transform="translate(1.5,2.43) scale(0.19526)"><path d="M0 33.70 L24.85 57.08 L66.58 8.84 L56.37 0 L23.85 37.60 L9.26 23.86 Z" fill="#C98A2B"/></g></svg></span>
      C-DIRECT
    </a>
    <div class="droite"></div>
  </div>
</div>

<div class="wrap">
  <h1 data-fr="Nouveaux contrats" data-en="New contracts">Nouveaux contrats</h1>
  <p class="sous" id="sous" data-fr="Lot de contrats publiés ensemble" data-en="Batch of contracts posted together">Lot de contrats publiés ensemble</p>

  <div class="carte">
    <div class="chargement" id="chargement" data-fr="Chargement du lot…" data-en="Loading batch…">Chargement du lot…</div>
    <table id="tableau" style="display:none">
      <thead><tr><th data-fr="Référence" data-en="Reference">Référence</th><th data-fr="Date" data-en="Date">Date</th><th data-fr="Heures" data-en="Hours">Heures</th><th class="cache-mobile" data-fr="Ville" data-en="City">Ville</th><th data-fr="Tarif" data-en="Rate">Tarif</th><th></th></tr></thead>
      <tbody id="lignes"></tbody>
    </table>
  </div>
  <p class="legende" id="legende" style="display:none" data-fr="Les lignes <b>surlignées</b> correspondent à vos critères (distance, tarif, logiciel, disponibilités). Touchez une ligne pour ouvrir la fiche et postuler." data-en="<b>Highlighted</b> rows match your criteria (distance, rate, software, availability). Tap a row to open the details and apply.">Les lignes <b>surlignées</b> correspondent à vos critères (distance, tarif, logiciel, disponibilités). Touchez une ligne pour ouvrir la fiche et postuler.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/supabase-config.js?v=20260723b"></script>
<script src="/auth.js?v=20260809e"></script>
<script>
const sb = window.sbClient;
const $ = id => document.getElementById(id);

function batchDepuisUrl(){
  const m = location.pathname.match(/\/nouveaux\/([0-9a-f-]{36})/i);
  if(m) return m[1];
  return new URLSearchParams(location.search).get('id');
}

(async function(){
  await cdExigerConnexion();
  cdEnteteConnecte();

  const id = batchDepuisUrl();
  if(!id){ $('chargement').textContent = cdT('Lot introuvable — lien incomplet.','Batch not found — incomplete link.'); return; }

  const { data, error } = await sb.rpc('get_batch_contrats', { p_batch: id });
  if(error){ $('chargement').textContent = cdT('Erreur : ','Error: ') + error.message; return; }
  if(!data || !data.length){ $('chargement').textContent = cdT('Lot introuvable ou vide.','Batch not found or empty.'); return; }

  $('chargement').style.display = 'none';
  $('tableau').style.display = ''; $('legende').style.display = '';
  const n = data.length, m = data.filter(k=>k.correspond).length;
  $('sous').textContent = cdLang()==='en'
    ? (n + ' contracts posted together · ' + m + ' match your criteria')
    : (n + ' contrats publiés ensemble · ' + m + ' correspondent à vos critères');

  const tb = $('lignes');
  data.forEach(k=>{
    const tr = document.createElement('tr');
    if(k.correspond) tr.className = 'pour-vous';
    tr.onclick = ()=>{ location.href = '/c/' + encodeURIComponent(k.numero_reference); };
    const td = (t, cls)=>{ const c=document.createElement('td'); if(cls) c.className=cls; c.textContent=t; return c; };
    const etat = document.createElement('td');
    etat.innerHTML = k.statut !== 'ouvert'
      ? '<span class="badge ferme">' + (k.statut==='attribue'?cdT('Confirmé','Confirmed'):k.statut) + '</span>'
      : (k.correspond ? '<span class="badge match">'+cdT('Pour vous','For you')+'</span>' : '');
    tr.append(
      td(k.numero_reference, 'ref'),
      td(cdDate(k.date_contrat)),
      td(cdHeure(k.heure_debut) + ' – ' + cdHeure(k.heure_fin)),
      td(k.ville || '—', 'cache-mobile'),
      td(cdArgent(k.tarif_horaire) + '/h', 'tarif'),
      etat
    );
    tb.appendChild(tr);
  });
})();
</script>
</body>
</html>
